name: Cricflix M3U Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: cricflix-m3u-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. Detect M3U Links
      - name: Detect M3U Links
        run: python detect_m3u.py

      # 5. Upload Detection Results
      - name: Upload Detection Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cricflix-M3U-Results
          path: |
            detected-m3u.txt
            m3u_sources.json
            report.md
          if-no-files-found: warn
          retention-days: 30

      # 6. Save Results to Repository
      - name: Save Results to Repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git add detected-m3u.txt
          git add m3u_sources.json
          git add report.md

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update Cricflix M3U detection"

          git pull --rebase origin "$BRANCH"

          git push origin "HEAD:$BRANCH"

          echo "Results successfully saved!"
