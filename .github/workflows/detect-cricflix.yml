
name: Cricflix M3U Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Detect M3U Links
        run: python detect_m3u.py

      - name: Upload Detection Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cricflix-M3U-Results
          path: |
            detected-m3u.txt
            m3u_sources.json
            report.md
          if-no-files-found: warn

      - name: Save Results to Repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detected-m3u.txt m3u_sources.json report.md
          git diff --cached --quiet || git commit -m "Update Cricflix M3U detection"
          git push
