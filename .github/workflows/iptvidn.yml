# Rakho: .github/workflows/iptvidn.yml
name: IPTVIDN Playlist Update

on:
  schedule:
    - cron: "*/30 * * * *"   # prottek 30 minute e (token expire hoy tai)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python iptvidn.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptvidn.json iptvidn.m3u
          git diff --staged --quiet || git commit -m "Update playlist"
          git push
