name: Update M3U Playlist

on:
  schedule:
    - cron: "0 */6 * * *"   # prottek 6 ghonta por por
  workflow_dispatch:         # manually run korar jonne

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download playlist
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python sarah.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sarah.m3u sarah.json
          git diff --staged --quiet || git commit -m "Update playlist"
          git push
