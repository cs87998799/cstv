# Rakho: .github/workflows/sarah.yml
name: SARAH Playlist Update

on:
  schedule:
    - cron: "*/30 * * * *"   # prottek 30 minute e (token expire hoy tai)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python sarah.py
        timeout-minutes: 15

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug_page.html
            debug_report.txt
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sarah.json sarah.m3u
          git diff --staged --quiet || git commit -m "Update playlist"
          git push
