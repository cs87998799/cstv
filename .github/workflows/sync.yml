name: Sync Toffee and SonyLiv Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest files
        run: |
          curl -fsSL -o toffee_data.json "https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/main/toffee_data.json"
          curl -fsSL -o toffee_playlist.m3u "https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/main/toffee_playlist.m3u"
          curl -fsSL -o sonyLiv_data.json "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/main/sonyLiv_data.json"
          curl -fsSL -o sonyLiv.m3u "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/main/sonyLiv.m3u"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toffee_data.json toffee_playlist.m3u sonyLiv_data.json sonyLiv.m3u
          git diff --staged --quiet || git commit -m "Auto sync"
          git push
