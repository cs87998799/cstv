name: Update channels.json

on:
  schedule:
    - cron: "0 */1 * * *"   # every 6 hours
  workflow_dispatch:         # manual run button
  push:
    paths:
      - "scripts/build_channels.py"

permissions:
  contents: write

concurrency:
  group: update-channels
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build channels.json
        run: python scripts/build_channels.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels(1).json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update channels(1).json [skip ci]"
            git push
          fi
          # Vercel redeploys automatically on push
