<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSTV</title>
<style>
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#191f30;color:#45e0bd;font-size:28px;font-weight:bold}
main{padding:16px}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:8px;border:0;margin:10px 0 18px}
.card{background:#20283a;padding:16px;margin:10px 0;border-radius:10px}
.card img{width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:12px}
button{background:#45e0bd;border:0;padding:10px 16px;border-radius:7px;font-weight:bold}
small{color:#b8c3d9}
</style>
</head>
<body>
<header>📺 CSTV</header>
<main>
<h2>Live Channels</h2>
<input id="search" placeholder="Search channels..." oninput="filterChannels()">
<div id="channels">Loading channels...</div>
</main>
<script>
let channels=[];
const playlistURL="https://cs87998799.github.io/cstv/channels.json";

async function loadChannels(){
 const box=document.getElementById("channels");
 try{
  const response=await fetch(playlistURL+"?t="+Date.now());
  if(!response.ok) throw new Error("Playlist unavailable");
  const data=await response.json();
  channels=data.channels||[];
  filterChannels();
 }catch(error){
  box.textContent="Could not load channels. Check channels.json.";
 }
}

function filterChannels(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=channels.filter(c=>
  (c.name||"").toLowerCase().includes(q)||
  (c.category||"").toLowerCase().includes(q)
 );
 document.getElementById("channels").innerHTML=list.map((c,i)=>
  `<div class="card">
   ${c.logo?`<img src="${c.logo}" alt="">`:""}
   <b>${c.name||"Channel"}</b><br>
   <small>${c.category||""}</small><br><br>
   <button onclick="playChannel(${i})">Play</button>
  </div>`
 ).join("")||"No channels found.";
}

function playChannel(i){
 const c=channels.filter(c=>
  (c.name||"").toLowerCase().includes(document.getElementById("search").value.toLowerCase())||
  (c.category||"").toLowerCase().includes(document.getElementById("search").value.toLowerCase())
 )[i];
 if(c&&c.url) window.open(c.url,"_blank");
 else alert("Stream URL unavailable.");
}

loadChannels();
</script>
</body>
</html>
