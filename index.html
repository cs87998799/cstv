<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Tv - Multi JSON Live Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for .m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">CS Tv Live</h1>
        <span id="status-badge" class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-semibold">Loading Channels...</span>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-1">
        <h2 class="text-lg font-bold mb-4">Available Channels</h2>
        
        <!-- Channel List Grid -->
        <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Channels will be loaded here dynamically -->
        </div>
    </main>

    <!-- Video Player Modal / Section -->
    <div id="player-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center">
            <h3 id="player-title" class="text-base font-bold text-pink-400">Playing Channel</h3>
            <button id="close-player" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg text-sm font-bold">✕ Close</button>
        </div>
        
        <div class="flex-1 flex items-center justify-center my-4">
            <video id="video-player" class="w-full max-h-[70vh] bg-black rounded-xl shadow-2xl" controls autoplay playsinline></video>
        </div>
        
        <div class="text-center text-xs text-slate-400">
            CS Tv Secure Streaming Player
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-400">
        © 2026 CS Tv • All Rights Reserved
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // আপনার GitHub Raw JSON লিংক এবং আপনার অন্য JSON ফাইলের লিংক এখানে দিন
        const jsonSources = [
            'https://raw.githubusercontent.com/srhady/SonyLiv/main/channels.json',
            'my-channels.json' // এখানে আপনার দ্বিতীয় JSON ফাইলের সঠিক লিংক বা পাথ দিন
        ];

        let allChannels = [];
        let hlsInstance = null;

        async function fetchAllJsonFiles() {
            const statusBadge = document.getElementById('status-badge');
            
            try {
                // একসাথে সবকটি JSON ফেচ করা
                const promises = jsonSources.map(url => 
                    fetch(url)
                        .then(res => {
                            if (!res.ok) throw new Error(`Failed: ${url}`);
                            return res.json();
                        })
                        .catch(err => {
                            console.warn(err);
                            return []; // কোনো ফাইল লোড না হলে ফাঁকা অ্যারে রিটার্ন করবে যাতে ক্র্যাশ না করে
                        })
                );

                const results = await Promise.all(promises);
                
                // সব ডেটা এক করা
                let combined = [];
                results.forEach(data => {
                    if (Array.isArray(data)) {
                        combined = [...combined, ...data];
                    } else if (data && typeof data === 'object') {
                        // যদি অবজেক্টের ভেতরে channels অ্যারে থাকে
                        const list = data.channels || data.data || data.items || [];
                        combined = [...combined, ...list];
                    }
                });

                allChannels = combined;

                if (allChannels.length > 0) {
                    statusBadge.textContent = `${allChannels.length} Channels Loaded`;
                    statusBadge.className = "text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-semibold";
                    renderChannels(allChannels);
                } else {
                    statusBadge.textContent = "No channels found";
                    statusBadge.className = "text-xs bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full font-semibold";
                }

            } catch (error) {
                console.error('Error loading JSONs:', error);
                statusBadge.textContent = "Load Error";
                statusBadge.className = "text-xs bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full font-semibold";
            }
        }

        function renderChannels(channels) {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = channels.map((ch, index) => `
                <button onclick="playChannel(${index})" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-pink-500 p-4 rounded-xl flex flex-col items-center text-center transition group">
                    <div class="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mb-2 overflow-hidden border border-slate-700">
                        ${ch.logo ? `<img src="${ch.logo}" alt="${ch.name}" class="w-full h-full object-contain" />` : `<span class="text-pink-400 font-bold text-sm">TV</span>`}
                    </div>
                    <span class="text-sm font-bold text-white group-hover:text-pink-400 truncate w-full">${ch.name || 'Live Channel'}</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">${ch.category || 'Live'}</span>
                </button>
            `).join('');
        }

        function playChannel(index) {
            const ch = allChannels[index];
            if (!ch) return;

            const modal = document.getElementById('player-modal');
            const title = document.getElementById('player-title');
            const video = document.getElementById('video-player');

            title.textContent = ch.name;
            modal.classList.remove('hidden');

            const streamUrl = ch.url || ch.streamUrl || ch.link;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (streamUrl && streamUrl.includes('.m3u8') && window.Hls && Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            } else if (streamUrl) {
                video.src = streamUrl;
                video.play().catch(e => console.log("Autoplay blocked:", e));
            }
        }

        document.getElementById('close-player').addEventListener('click', () => {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = "";
            modal.classList.add('hidden');
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        });

        // পেজ লোড হওয়ার সাথে সাথে JSON ফেচ ফাংশন কল হবে
        window.addEventListener('DOMContentLoaded', fetchAllJsonFiles);
    </script>
</body>
</html>
