
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>CSTV — Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --bg: #09090d;
  --panel: #17171f;
  --red: #e50914;
  --text: #fff;
  --muted: #aaa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px;
  background: #101015;
  border-bottom: 1px solid #292932;
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  color: var(--red);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
}
.brand small {
  display: block;
  color: #ddd;
  font-size: 10px;
  letter-spacing: 3px;
}
#search {
  width: min(48%, 300px);
  padding: 11px 13px;
  border: 1px solid #383842;
  border-radius: 22px;
  background: #22222b;
  color: white;
  outline: none;
}
main { padding: 16px; }
h2 { font-size: 19px; margin: 16px 0 12px; }
button, select { cursor: pointer; }
button {
  border: 1px solid #383842;
  border-radius: 8px;
  padding: 9px 12px;
  color: white;
  background: #24242d;
  font-size: 13px;
}
button:active { transform: scale(.97); }
button.active, button.primary {
  background: var(--red);
  border-color: var(--red);
}
.tools, #categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.tools button { border-radius: 20px; }
#player {
  background: #111116;
  border: 1px solid #292932;
  border-radius: 13px;
  overflow: hidden;
  margin-bottom: 20px;
}
#playerTitle {
  padding: 12px 14px;
  font-size: 16px;
  font-weight: bold;
}
#stage {
  position: relative;
  background: #000;
  aspect-ratio: 16 / 9;
  width: 100%;
}
#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
#stage:fullscreen {
  width: 100vw;
  height: 100vh;
  aspect-ratio: auto;
}
#stage:fullscreen #video {
  width: 100%;
  height: 100%;
}
.live {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 6px 10px;
  border-radius: 5px;
  background: var(--red);
  font-weight: bold;
  font-size: 12px;
  pointer-events: none;
  animation: livePulse 1.4s infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 #e5091460; }
  50% { opacity: .72; box-shadow: 0 0 0 7px #e5091400; }
}
.overlay {
  position: absolute;
  inset: auto 0 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 35px 10px 12px;
  background: linear-gradient(transparent, #000d);
  transition: opacity .3s, visibility .3s;
}
.overlay.cstv-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.overlay button { background: #202027e8; }
#quality {
  max-width: 105px;
  padding: 9px;
  background: #24242d;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
}
#status {
  color: var(--muted);
  padding: 0 14px 12px;
  font-size: 12px;
}
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 13px;
}
.channel {
  position: relative;
  min-width: 0;
  background: var(--panel);
  border: 1px solid #292932;
  border-radius: 11px;
  padding: 12px;
  cursor: pointer;
  transition: transform .22s, border-color .22s, box-shadow .22s;
  outline: none;
}
.channel:hover, .channel:focus {
  transform: translateY(-4px) scale(1.015);
  border-color: var(--red);
  box-shadow: 0 8px 24px #e5091430;
}
.channel:active { transform: scale(.98); }
.logo {
  height: 75px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 9px;
}
.logo img {
  max-width: 100%;
  max-height: 70px;
  object-fit: contain;
}
.logoFallback {
  font-size: 27px;
  font-weight: bold;
  color: var(--red);
}
.channelName {
  font-size: 14px;
  font-weight: bold;
  overflow-wrap: anywhere;
  padding-right: 3px;
}
.meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
}
.fav {
  position: absolute;
  top: 7px;
  right: 7px;
  padding: 6px 8px;
  border-radius: 16px;
  background: #08080bdc;
  border-color: #555;
  z-index: 2;
}
.fav.is-fav { color: #ffd54a; border-color: #ffd54a; }
#empty {
  display: none;
  color: var(--muted);
  text-align: center;
  padding: 30px 10px;
}
footer {
  color: #777;
  text-align: center;
  font-size: 11px;
  padding: 22px;
}
@media (max-width: 500px) {
  header { padding: 12px; }
  .brand { font-size: 23px; }
  main { padding: 12px; }
  #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .channel { padding: 10px; }
  .overlay { gap: 5px; }
  .overlay button { padding: 8px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">CSTV<small>LIVE TELEVISION</small></div>
  <input id="search" type="search" placeholder="চ্যানেল খুঁজুন...">
</header>

<main>
  <section id="player">
    <div id="playerTitle">CSTV Live Player</div>
    <div id="stage">
      <video id="video" controls playsinline autoplay></video>
      <div class="live">● LIVE</div>
      <div class="overlay">
        <button id="prevBtn">⏮ Previous</button>
        <button id="playBtn">▶ Play</button>
        <button id="nextBtn">Next ⏭</button>
        <select id="quality" aria-label="Video quality">
          <option value="-1">Auto Quality</option>
        </select>
        <button id="fullBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div id="status">চ্যানেল চালু করতে নিচ থেকে একটি চ্যানেল বেছে নাও।</div>
  </section>

  <h2>তোমার CSTV</h2>
  <div class="tools">
    <button id="allBtn" class="active">📺 সব চ্যানেল</button>
    <button id="favoritesBtn">⭐ Favourite</button>
    <button id="recentBtn">🕘 Recently Watched</button>
    <button id="autoFullBtn">⛶ Auto Fullscreen: OFF</button>
    <button id="refreshBtn">↻ Refresh Channels</button>
  </div>

  <nav id="categories" aria-label="Channel categories"></nav>

  <h2 id="sectionTitle">সব চ্যানেল</h2>
  <section id="grid"></section>
  <div id="empty">এখানে কোনো চ্যানেল পাওয়া যায়নি।</div>
</main>

<footer>CSTV • Personal Live TV</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const video = $('video');
  const stage = $('stage');
  const grid = $('grid');
  const status = $('status');
  const quality = $('quality');

  let channels = [];
  let visibleChannels = [];
  let currentChannel = null;
  let currentCategory = 'সব';
  let viewMode = 'all';
  let hls = null;
  let hideTimer = null;
  let autoFullscreen = localStorage.getItem('cstv_auto_fullscreen') === 'true';

  function readArray(key) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (_) {
      return [];
    }
  }

  function saveArray(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  }

  function channelName(c) {
    return String(c.name || c.title || c.channel || 'Unnamed Channel');
  }

  function channelUrl(c) {
    return String(c.url || c.stream || c.link || '');
  }

  function channelCategory(c) {
    return String(c.category || 'অন্যান্য');
  }

  function logoUrl(c) {
    return String(c.logo || '');
  }

  function isFavorite(c) {
    return readArray('cstv_favorites').includes(channelUrl(c));
  }

  function updateFeatureButtons() {
    $('autoFullBtn').textContent =
      '⛶ Auto Fullscreen: ' + (autoFullscreen ? 'ON' : 'OFF');

    $('autoFullBtn').classList.toggle('active', autoFullscreen);
    $('allBtn').classList.toggle('active', viewMode === 'all');
    $('favoritesBtn').classList.toggle('active', viewMode === 'favorites');
    $('recentBtn').classList.toggle('active', viewMode === 'recent');
  }

  function showNotice(message) {
    status.textContent = message;
  }

  function renderCategories() {
    const nav = $('categories');
    nav.replaceChildren();

    const names = ['সব', ...new Set(channels.map(channelCategory))];

    names.forEach(name => {
      const btn = document.createElement('button');
      btn.textContent = name;
      btn.classList.toggle('active', currentCategory === name);
      btn.onclick = () => {
        currentCategory = name;
        renderCategories();
        renderChannels();
      };
      nav.appendChild(btn);
    });
  }

  function toggleFavorite(channel, button) {
    const url = channelUrl(channel);
    let favorites = readArray('cstv_favorites');

    if (favorites.includes(url)) {
      favorites = favorites.filter(item => item !== url);
    } else {
      favorites.unshift(url);
    }

    saveArray('cstv_favorites', favorites);
    button.textContent = isFavorite(channel) ? '★' : '☆';
    button.classList.toggle('is-fav', isFavorite(channel));
    button.title = isFavorite(channel) ? 'Remove Favourite' : 'Add Favourite';

    if (viewMode === 'favorites') renderChannels();
  }

  function renderChannels() {
    const query = $('search').value.trim().toLowerCase();
    const favorites = readArray('cstv_favorites');
    const recent = readArray('cstv_recent');

    visibleChannels = channels.filter(c => {
      const matchesCategory =
        currentCategory === 'সব' || channelCategory(c) === currentCategory;

      const matchesSearch =
        channelName(c).toLowerCase().includes(query) ||
        channelCategory(c).toLowerCase().includes(query);

      const matchesView =
        viewMode === 'all' ||
        (viewMode === 'favorites' && favorites.includes(channelUrl(c))) ||
        (viewMode === 'recent' && recent.includes(channelUrl(c)));

      return matchesCategory && matchesSearch && matchesView;
    });

    if (viewMode === 'recent') {
      visibleChannels.sort((a, b) =>
        recent.indexOf(channelUrl(a)) - recent.indexOf(channelUrl(b))
      );
    }

    grid.replaceChildren();

    visibleChannels.forEach(channel => {
      const card = document.createElement('article');
      card.className = 'channel';
      card.tabIndex = 0;

      const logo = document.createElement('div');
      logo.className = 'logo';

      if (logoUrl(channel)) {
        const img = document.createElement('img');
        img.src = logoUrl(channel);
        img.alt = channelName(channel) + ' logo';
        img.loading = 'lazy';
        img.onerror = () => {
          logo.replaceChildren();
          const fallback = document.createElement('span');
          fallback.className = 'logoFallback';
          fallback.textContent = channelName(channel).slice(0, 2).toUpperCase();
          logo.appendChild(fallback);
        };
        logo.appendChild(img);
      } else {
        const fallback = document.createElement('span');
        fallback.className = 'logoFallback';
        fallback.textContent = channelName(channel).slice(0, 2).toUpperCase();
        logo.appendChild(fallback);
      }

      const name = document.createElement('div');
      name.className = 'channelName';
      name.textContent = channelName(channel);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = channelCategory(channel);

      const fav = document.createElement('button');
      fav.className = 'fav' + (isFavorite(channel) ? ' is-fav' : '');
      fav.textContent = isFavorite(channel) ? '★' : '☆';
      fav.title = isFavorite(channel) ? 'Remove Favourite' : 'Add Favourite';
      fav.setAttribute('aria-label', 'Toggle favourite');
      fav.onclick = event => {
        event.stopPropagation();
        toggleFavorite(channel, fav);
      };

      card.append(logo, name, meta, fav);
      card.onclick = () => playChannel(channel);
      card.onkeydown = event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          playChannel(channel);
        }
      };

      grid.appendChild(card);
    });

    $('empty').style.display = visibleChannels.length ? 'none' : 'block';

    const titles = {
      all: 'সব চ্যানেল',
      favorites: '⭐ Favourite Channels',
      recent: '🕘 Recently Watched'
    };
    $('sectionTitle').textContent = titles[viewMode];
    updateFeatureButtons();
  }

  function addRecent(channel) {
    const url = channelUrl(channel);
    const recent = readArray('cstv_recent').filter(item => item !== url);
    recent.unshift(url);
    saveArray('cstv_recent', recent.slice(0, 12));
  }

  function destroyHls() {
    if (hls) {
      try { hls.destroy(); } catch (_) {}
      hls = null;
    }
  }

  function fillQuality() {
    quality.replaceChildren();
    const auto = document.createElement('option');
    auto.value = '-1';
    auto.textContent = 'Auto Quality';
    quality.appendChild(auto);
  }

  async function requestFullscreen() {
    try {
      if (document.fullscreenElement) return;

      if (stage.requestFullscreen) {
        await stage.requestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      }
    } catch (_) {
      showNotice('এই ডিভাইসে Auto Fullscreen অনুমোদিত নয়। Fullscreen বোতাম ব্যবহার করো।');
    }
  }

  async function playChannel(channel) {
    const url = channelUrl(channel);
    if (!url) return;

    currentChannel = channel;
    $('playerTitle').textContent = channelName(channel);
    showNotice('লোড হচ্ছে: ' + channelName(channel));

    addRecent(channel);
    renderChannels();

    destroyHls();
    fillQuality();

    video.pause();
    video.removeAttribute('src');
    video.load();

    const isHls = /\.m3u8($|\?)/i.test(url) ||
                  url.toLowerCase().includes('.m3u8');

    if (isHls && window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (hls && hls.levels) {
          hls.levels.forEach((level, index) => {
            const option = document.createElement('option');
            option.value = String(index);
            option.textContent = level.height
              ? level.height + 'p'
              : 'Quality ' + (index + 1);
            quality.appendChild(option);
          });
        }

        video.play().catch(() => {
          showNotice('প্লেয়ার প্রস্তুত। Play বোতাম চাপো।');
        });
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          showNotice('স্ট্রিম চালানো যাচ্ছে না। লিংক বা নেটওয়ার্ক পরীক্ষা করো।');
          if (hls) hls.destroy();
          hls = null;
        }
      });

      hls.loadSource(url);
      hls.attachMedia(video);
    } else {
      video.src = url;
      video.load();
      video.play().catch(() => {
        showNotice('প্লেয়ার প্রস্তুত। Play বোতাম চাপো।');
      });
    }

    if (autoFullscreen) {
      requestFullscreen();
    }
  }

  function playAdjacent(direction) {
    if (!visibleChannels.length) return;

    let index = visibleChannels.findIndex(c =>
      currentChannel && channelUrl(c) === channelUrl(currentChannel)
    );

    if (index < 0) index = 0;
    else index = (index + direction + visibleChannels.length) %
                 visibleChannels.length;

    playChannel(visibleChannels[index]);
  }

  $('allBtn').onclick = () => {
    viewMode = 'all';
    renderChannels();
  };

  $('favoritesBtn').onclick = () => {
    viewMode = 'favorites';
    renderChannels();
  };

  $('recentBtn').onclick = () => {
    viewMode = 'recent';
    renderChannels();
  };

  $('autoFullBtn').onclick = () => {
    autoFullscreen = !autoFullscreen;
    try {
      localStorage.setItem('cstv_auto_fullscreen', String(autoFullscreen));
    } catch (_) {}
    updateFeatureButtons();

    if (autoFullscreen && currentChannel) requestFullscreen();
    showNotice('Auto Fullscreen ' + (autoFullscreen ? 'চালু' : 'বন্ধ') + ' করা হয়েছে।');
  };

  $('refreshBtn').onclick = loadChannels;
  $('search').addEventListener('input', renderChannels);

  $('prevBtn').onclick = () => playAdjacent(-1);
  $('nextBtn').onclick = () => playAdjacent(1);

  $('playBtn').onclick = () => {
    if (video.paused) {
      video.play().catch(() => showNotice('এই স্ট্রিমটি চালানো যাচ্ছে না।'));
    } else {
      video.pause();
    }
  };

  video.addEventListener('play', () => {
    $('playBtn').textContent = '⏸ Pause';
    showNotice('চলছে: ' + (currentChannel ? channelName(currentChannel) : 'Live TV'));
    showControls();
  });

  video.addEventListener('pause', () => {
    $('playBtn').textContent = '▶ Play';
    showControls();
  });

  video.addEventListener('waiting', () => showNotice('বাফার হচ্ছে...'));
  video.addEventListener('playing', () => {
    showNotice('চলছে: ' + (currentChannel ? channelName(currentChannel) : 'Live TV'));
  });

  video.addEventListener('error', () => {
    showNotice('ভিডিও চালাতে সমস্যা হচ্ছে। স্ট্রিম URL পরীক্ষা করো।');
  });

  quality.onchange = () => {
    if (hls && quality.value !== '-1') {
      hls.currentLevel = Number(quality.value);
    } else if (hls) {
      hls.currentLevel = -1;
    }
  };

  $('fullBtn').onclick = async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await requestFullscreen();
      }
    } catch (_) {
      showNotice('Fullscreen এই ব্রাউজারে সমর্থিত নয়।');
    }
  };

  $('video').addEventListener('dblclick', requestFullscreen);

  document.addEventListener('keydown', event => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;

    if (event.key === 'ArrowRight') playAdjacent(1);
    if (event.key === 'ArrowLeft') playAdjacent(-1);
    if (event.key.toLowerCase() === 'f') requestFullscreen();
  });

  function showControls() {
    const overlay = stage.querySelector('.overlay');
    clearTimeout(hideTimer);
    overlay.classList.remove('cstv-hidden');

    if (!video.paused) {
      hideTimer = setTimeout(() => {
        if (!video.paused) overlay.classList.add('cstv-hidden');
      }, 5000);
    }
  }

  stage.addEventListener('mousemove', showControls);
  stage.addEventListener('touchstart', showControls);
  stage.addEventListener('click', showControls);

  async function loadChannels() {
    showNotice('চ্যানেল লোড হচ্ছে...');

    try {
      const response = await fetch('./channels.json?v=' + Date.now(), {
        cache: 'no-store'
      });

      if (!response.ok) throw new Error('HTTP ' + response.status);

      const data = await response.json();
      const list = Array.isArray(data) ? data : data.channels;

      if (!Array.isArray(list)) throw new Error('Invalid channels.json');

      channels = list.filter(c => c && channelUrl(c));

      renderCategories();
      renderChannels();

      if (channels.length) {
        showNotice(channels.length + 'টি চ্যানেল লোড হয়েছে।');
      } else {
        showNotice('channels.json ফাইলে কোনো বৈধ চ্যানেল নেই।');
      }
    } catch (error) {
      console.error(error);
      showNotice('চ্যানেল লোড হয়নি। channels.json ফাইল ও GitHub Pages পরীক্ষা করো।');
    }
  }

  updateFeatureButtons();
  loadChannels();
})();
</script>
</body>
</html>
