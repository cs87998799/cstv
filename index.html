
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090d">
<title>CSTV — Live Television</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --bg:#09090d;--panel:#17171f;--panel2:#22222d;
  --red:#e50914;--text:#fff;--muted:#a5a5b2;
  --line:#30303b;--gold:#ffd54a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;color:#fff;background:var(--panel2);
border:1px solid var(--line);border-radius:9px;padding:10px 13px}
button:hover,button:focus-visible{border-color:var(--red);outline:none}
button:active{transform:scale(.97)}
button.active,button.primary{background:var(--red);border-color:var(--red)}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;
  justify-content:space-between;gap:16px;padding:14px 4%;
  background:#09090df2;border-bottom:1px solid #ffffff12;
  backdrop-filter:blur(14px)
}
.brand{font-size:29px;font-weight:1000;color:var(--red);letter-spacing:1px}
.brand small{display:block;font-size:9px;letter-spacing:3px;color:#ddd}
.headerRight{display:flex;align-items:center;gap:9px}
#search{width:min(32vw,300px);min-width:120px;background:#20202a;
border:1px solid var(--line);color:#fff;border-radius:25px;
padding:11px 15px;outline:none}
#search:focus{border-color:var(--red)}
main{max-width:1600px;margin:auto;padding:20px 4% 40px}
.hero{
  position:relative;overflow:hidden;min-height:245px;border-radius:18px;
  padding:clamp(22px,5vw,55px);display:flex;align-items:flex-end;
  background:
  radial-gradient(ellipse at 80% 20%,#e5091444,transparent 45%),
  linear-gradient(110deg,#20202b,#101016 60%,#30090e);
  border:1px solid #ffffff10;margin-bottom:24px
}
.hero:after{content:"CSTV";position:absolute;right:2%;top:2%;
font-size:clamp(65px,15vw,190px);font-weight:1000;color:#ffffff08;
pointer-events:none}
.heroContent{position:relative;z-index:1;max-width:620px}
.eyebrow{color:#ff454d;font-size:12px;letter-spacing:3px;font-weight:bold}
.hero h1{font-size:clamp(28px,5vw,52px);margin:12px 0}
.hero p{color:#c8c8d2;line-height:1.6;margin:0 0 18px}
.heroButtons{display:flex;gap:10px;flex-wrap:wrap}
#player{background:#111116;border:1px solid var(--line);
border-radius:15px;overflow:hidden;margin:20px 0 28px}
.playerHead{display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:13px 16px}
#playerTitle{font-weight:bold;font-size:17px;overflow-wrap:anywhere}
#channelNumber{color:var(--red);font-weight:bold;margin-right:8px}
#stage{position:relative;background:#000;width:100%;aspect-ratio:16/9}
#video,#ytFrame{position:absolute;inset:0;width:100%;height:100%;
border:0;background:#000;object-fit:contain}
#ytFrame{display:none}
#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}
#stage:fullscreen #video,#stage:fullscreen #ytFrame{width:100%;height:100%}
.live{position:absolute;top:13px;left:13px;z-index:3;
background:var(--red);border-radius:5px;padding:6px 9px;
font-size:11px;font-weight:bold;pointer-events:none}
.playerOverlay{position:absolute;bottom:0;left:0;right:0;z-index:4;
display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;
padding:45px 10px 12px;background:linear-gradient(transparent,#000e);
transition:opacity .25s}
.playerOverlay.hidden{opacity:0;pointer-events:none}
.playerOverlay button{background:#22222be8}
#quality{max-width:125px;background:#22222b;color:#fff;
border:1px solid #555;border-radius:8px;padding:9px}
#status{font-size:12px;color:var(--muted);padding:0 15px 13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 17px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;
gap:12px;margin:27px 0 12px}
h2{font-size:20px;margin:0}
#categories{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 12px;
scrollbar-width:thin}
#categories button{white-space:nowrap;border-radius:20px}
#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}
.channel{position:relative;min-width:0;background:var(--panel);
border:1px solid #ffffff10;border-radius:12px;padding:12px;
cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;
outline:none}
.channel:hover,.channel:focus-visible{transform:translateY(-4px);
border-color:var(--red);box-shadow:0 10px 25px #e5091424}
.channel.current{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.channel:focus-visible{outline:2px solid #ff5c62;outline-offset:2px}
.logo{height:76px;display:flex;align-items:center;justify-content:center;
margin-bottom:10px;overflow:hidden}
.logo img{max-width:100%;max-height:70px;object-fit:contain}
.logoFallback{font-size:27px;font-weight:900;color:var(--red)}
.channelNo{position:absolute;top:7px;left:8px;color:#bbb;
font-size:10px;background:#000a;border-radius:4px;padding:4px 5px}
.channelName{font-size:13px;font-weight:bold;overflow-wrap:anywhere;
padding:0 2px;line-height:1.4}
.meta{font-size:11px;color:var(--muted);margin-top:6px}
.fav{position:absolute;right:7px;top:7px;z-index:2;padding:5px 8px;
border-radius:20px;background:#09090ddd}
.fav.is-fav{color:var(--gold);border-color:var(--gold)}
#empty{display:none;text-align:center;padding:35px 10px;color:var(--muted)}
#numberPad{display:none;position:absolute;z-index:8;top:50%;left:50%;
transform:translate(-50%,-50%);width:min(300px,85%);padding:18px;
background:#101016f5;border:1px solid #555;border-radius:15px;
box-shadow:0 15px 50px #000b}
#numberDisplay{text-align:center;font-size:30px;font-weight:bold;
letter-spacing:5px;padding:10px;color:#fff;min-height:52px}
.padGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.padGrid button{font-size:20px;padding:13px}
.padActions{display:flex;gap:8px;margin-top:8px}
.padActions button{flex:1}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
z-index:50;max-width:90%;background:#24242d;color:#fff;
border:1px solid #555;border-radius:10px;padding:11px 16px;
font-size:13px;display:none;text-align:center}
footer{text-align:center;color:#777;font-size:11px;padding:25px}
.tvMode header{position:relative}
.tvMode .channel{padding:14px}
.tvMode .channelName{font-size:15px}
.tvMode button:focus-visible,.tvMode .channel:focus-visible{
outline:3px solid #fff;outline-offset:2px;border-color:var(--red)}
@media(max-width:1100px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){
 header{padding:11px 13px;gap:8px}.brand{font-size:24px}
 .brand small{font-size:8px;letter-spacing:2px}
 .headerRight{flex:1;justify-content:flex-end}
 #search{width:48vw;min-width:0;padding:10px}
 main{padding:13px}
 .hero{min-height:230px;border-radius:13px;padding:23px}
 #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .channel{padding:10px}
 .logo{height:65px}
 .logo img{max-height:60px}
 .playerHead{padding:11px}
 .playerOverlay{gap:5px;padding:30px 5px 8px}
 .playerOverlay button{font-size:11px;padding:8px}
 #quality{max-width:95px;font-size:11px;padding:8px}
}
@media(orientation:landscape) and (max-height:550px){
 header{padding:6px 14px}
 header .brand small{display:none}
 main{padding:8px 14px}
 .hero{min-height:130px;padding:15px}
 .hero h1{font-size:25px;margin:5px 0}
 .hero p{margin-bottom:8px}
 #player{margin:8px 0}
 #stage{height:calc(100vh - 150px);aspect-ratio:auto}
 #stage:fullscreen{height:100vh}
}
</style>
</head>

<body>
<header>
  <div class="brand">CSTV<small>LIVE TELEVISION</small></div>
  <div class="headerRight">
    <input id="search" type="search" placeholder="চ্যানেল খুঁজুন..." aria-label="Search channels">
    <button id="searchClear" title="Clear search">✕</button>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="heroContent">
      <div class="eyebrow">YOUR LIVE TV DESTINATION</div>
      <h1 id="heroTitle">সব বিনোদন, এক জায়গায়</h1>
      <p id="heroText">লাইভ স্পোর্টস, নিউজ, বাংলা টিভি, সিনেমা ও আরও অনেক কিছু।</p>
      <div class="heroButtons">
        <button class="primary" id="heroPlay">▶ Live TV দেখুন</button>
        <button id="heroRandom">🎲 Random Channel</button>
      </div>
    </div>
  </section>

  <section id="player">
    <div class="playerHead">
      <div><span id="channelNumber"></span><span id="playerTitle">CSTV Live Player</span></div>
      <button id="numberBtn" title="Channel number"># নম্বর</button>
    </div>

    <div id="stage">
      <video id="video" controls playsinline autoplay></video>
      <iframe id="ytFrame" allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen title="YouTube Live"></iframe>
      <div class="live">● LIVE</div>

      <div id="numberPad">
        <div id="numberDisplay">---</div>
        <div class="padGrid">
          <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
          <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
          <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
          <button data-digit="clear">C</button><button data-digit="0">0</button><button data-digit="back">⌫</button>
        </div>
        <div class="padActions">
          <button id="padCancel">Cancel</button><button class="primary" id="padGo">Tune</button>
        </div>
      </div>

      <div class="playerOverlay" id="playerOverlay">
        <button id="prevBtn">⏮ Previous</button>
        <button id="playBtn">▶ Play</button>
        <button id="nextBtn">Next ⏭</button>
        <select id="quality" aria-label="Video quality"><option value="-1">Auto Quality</option></select>
        <button id="fullBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div id="status">চ্যানেল লোড হচ্ছে...</div>
  </section>

  <div class="toolbar">
    <button id="allBtn" class="active">📺 সব চ্যানেল</button>
    <button id="favoritesBtn">⭐ Favourite</button>
    <button id="recentBtn">🕘 Recently Watched</button>
    <button id="autoFullBtn">⛶ Auto Fullscreen: OFF</button>
    <button id="refreshBtn">↻ Refresh Channels</button>
  </div>

  <nav id="categories" aria-label="Channel categories"></nav>

  <div class="sectionHead">
    <h2 id="sectionTitle">সব চ্যানেল</h2>
    <span id="count" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <section id="grid"></section>
  <div id="empty">এখানে কোনো চ্যানেল পাওয়া যায়নি।</div>
</main>

<footer>CSTV • Personal Live TV</footer>
<div id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const video = $("video"), frame = $("ytFrame"), stage = $("stage");
  const grid = $("grid"), quality = $("quality"), overlay = $("playerOverlay");

  let channels = [], visibleChannels = [], currentChannel = null;
  let currentCategory = "সব", viewMode = "all", hls = null;
  let autoFullscreen = localStorage.getItem("cstv_auto_fullscreen") === "true";
  let autoPlay = localStorage.getItem("cstv_autoplay") !== "false";
  let overlayTimer = null, toastTimer = null, numberBuffer = "";
  let numberTimer = null, logoCatalogue = null, logoLookupStarted = false;

  function readArray(key) {
    try {
      const a = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (_) { return []; }
  }
  function saveArray(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  }
  function nameOf(c) { return String(c.name || c.title || c.channel || "Unnamed Channel"); }
  function urlOf(c) { return String(c.url || c.stream || c.link || ""); }
  function categoryOf(c) { return String(c.category || "অন্যান্য"); }
  function logoOf(c) { return String(c.logo || c.logoUrl || ""); }
  function numberOf(c) { return channels.indexOf(c) + 1; }
  function channelCode(c) { return String(numberOf(c)).padStart(3, "0"); }
  function isFav(c) { return readArray("cstv_favorites").includes(urlOf(c)); }

  function toast(message) {
    $("toast").textContent = message;
    $("toast").style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").style.display = "none", 2400);
  }
  function status(message) { $("status").textContent = message; }

  function updateButtons() {
    $("autoFullBtn").textContent = "⛶ Auto Fullscreen: " + (autoFullscreen ? "ON" : "OFF");
    $("autoFullBtn").classList.toggle("active", autoFullscreen);
    $("allBtn").classList.toggle("active", viewMode === "all");
    $("favoritesBtn").classList.toggle("active", viewMode === "favorites");
    $("recentBtn").classList.toggle("active", viewMode === "recent");
  }

  function renderCategories() {
    const nav = $("categories");
    nav.replaceChildren();
    const cats = ["সব", ...new Set(channels.map(categoryOf))];
    cats.forEach(cat => {
      const b = document.createElement("button");
      b.textContent = cat;
      b.classList.toggle("active", currentCategory === cat);
      b.onclick = () => {
        currentCategory = cat;
        renderCategories();
        renderChannels();
      };
      nav.appendChild(b);
    });
  }

  function toggleFav(c) {
    let favs = readArray("cstv_favorites");
    const u = urlOf(c);
    favs = favs.includes(u) ? favs.filter(x => x !== u) : [u, ...favs];
    saveArray("cstv_favorites", favs);
    renderChannels();
  }

  function renderChannels() {
    const q = $("search").value.trim().toLowerCase();
    const favs = readArray("cstv_favorites"), recents = readArray("cstv_recent");

    visibleChannels = channels.filter(c => {
      const categoryMatch = currentCategory === "সব" || categoryOf(c) === currentCategory;
      const searchMatch = (nameOf(c) + " " + categoryOf(c)).toLowerCase().includes(q);
      const modeMatch = viewMode === "all" ||
        (viewMode === "favorites" && favs.includes(urlOf(c))) ||
        (viewMode === "recent" && recents.includes(urlOf(c)));
      return categoryMatch && searchMatch && modeMatch;
    });

    if (viewMode === "recent") {
      visibleChannels.sort((a,b) => recents.indexOf(urlOf(a)) - recents.indexOf(urlOf(b)));
    }

    grid.replaceChildren();
    visibleChannels.forEach(c => {
      const card = document.createElement("article");
      card.className = "channel" + (currentChannel && urlOf(c) === urlOf(currentChannel) ? " current" : "");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Channel " + channelCode(c) + " " + nameOf(c));

      const no = document.createElement("span");
      no.className = "channelNo";
      no.textContent = channelCode(c);

      const logo = document.createElement("div");
      logo.className = "logo";
      const logoUrl = logoOf(c) || findLogo(c);

      if (logoUrl) {
        const img = document.createElement("img");
        img.src = logoUrl;
        img.alt = nameOf(c) + " logo";
        img.loading = "lazy";
        img.onerror = () => {
          logo.replaceChildren(makeFallback(c));
        };
        logo.appendChild(img);
      } else {
        logo.appendChild(makeFallback(c));
      }

      const title = document.createElement("div");
      title.className = "channelName";
      title.textContent = nameOf(c);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = categoryOf(c);

      const fav = document.createElement("button");
      fav.className = "fav" + (isFav(c) ? " is-fav" : "");
      fav.textContent = isFav(c) ? "★" : "☆";
      fav.title = isFav(c) ? "Remove Favourite" : "Add Favourite";
      fav.setAttribute("aria-label", "Toggle favourite");
      fav.onclick = e => { e.stopPropagation(); toggleFav(c); };

      card.append(no, logo, title, meta, fav);
      card.onclick = () => playChannel(c, true);
      card.onkeydown = e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault(); playChannel(c, true);
        }
      };
      grid.appendChild(card);
    });

    $("empty").style.display = visibleChannels.length ? "none" : "block";
    $("count").textContent = visibleChannels.length + " channels";
    $("sectionTitle").textContent = ({
      all:"সব চ্যানেল", favorites:"⭐ Favourite Channels", recent:"🕘 Recently Watched"
    })[viewMode];
    updateButtons();
  }

  function makeFallback(c) {
    const s = document.createElement("span");
    s.className = "logoFallback";
    s.textContent = nameOf(c).replace(/[^a-zA-Z0-9\u0980-\u09FF ]/g, "").trim().slice(0,2).toUpperCase() || "TV";
    return s;
  }

  // If a logo is missing, try matching the public iptv-org channel catalogue.
  function normalize(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function findLogo(c) {
    if (!logoCatalogue) return "";
    const n = normalize(nameOf(c));
    const aliases = {
      "arydigital":["arydigital"],
      "tsports":["tsports","tsportsbd"],
      "bbcnews":["bbcnews"],
      "dwnews":["dwnews"],
      "starjalshahd":["starjalsha"],
      "atnbangla":["atnbangla"],
      "channeli":["channeli"],
      "jamunatv":["jamunatv"],
      "somoytv":["somoytv"],
      "ntv":["ntvbd","ntv"],
      "rtv":["rtvbd","rtv"],
      "deeptotv":["deeptotv"],
      "animalplanet":["animalplanet"],
      "disneychannel":["disneychannel"],
      "cartoonnetwork":["cartoonnetwork"],
      "aajtakhd":["aajtak"],
      "republictv":["republictv"],
      "indiatoday":["indiatoday"],
      "indiatv":["indiatv"],
      "ndtvenglish":["ndtv24x7"],
      "ndtvhindi":["ndtvindia"]
    };
    const candidates = aliases[n] || [n];
    const match = logoCatalogue.find(x =>
      candidates.includes(normalize(x.name)) && x.logo
    );
    return match ? match.logo : "";
  }

  async function loadLogoCatalogue() {
    if (logoLookupStarted) return;
    logoLookupStarted = true;
    try {
      const r = await fetch("https://iptv-org.github.io/api/channels.json");
      if (!r.ok) return;
      const data = await r.json();
      logoCatalogue = data.filter(x => x.logo);
      renderChannels();
    } catch (_) {
      // The main channel list works even if the external logo catalogue fails.
    }
  }

  function addRecent(c) {
    const u = urlOf(c);
    const a = readArray("cstv_recent").filter(x => x !== u);
    a.unshift(u);
    saveArray("cstv_recent", a.slice(0, 20));
  }

  function destroyHls() {
    if (hls) {
      try { hls.destroy(); } catch (_) {}
      hls = null;
    }
  }

  function resetQuality() {
    quality.replaceChildren();
    const opt = document.createElement("option");
    opt.value = "-1"; opt.textContent = "Auto Quality";
    quality.appendChild(opt);
  }

  function youtubeEmbed(url) {
    try {
      const u = new URL(url);
      let id = "";
      if (u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
      else if (u.pathname.includes("/live/")) id = u.pathname.split("/live/")[1].split("/")[0];
      else if (u.pathname.includes("/embed/")) id = u.pathname.split("/embed/")[1].split("/")[0];
      else id = u.searchParams.get("v") || "";
      if (/^[\w-]{11}$/.test(id)) return "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1";
    } catch (_) {}
    return "";
  }

  async function requestFullscreen() {
    try {
      if (document.fullscreenElement) return;
      if (stage.requestFullscreen) await stage.requestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      else toast("এই ব্রাউজারে Fullscreen সমর্থিত নয়");
    } catch (_) {
      toast("Fullscreen চালু করতে ভিডিওতে চাপ দিয়ে আবার চেষ্টা করো");
    }
  }

  async function tryLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch (_) {
      // Browser permission or a native APK setting may be required.
    }
  }

  async function playChannel(c, fromUser) {
    const url = urlOf(c);
    if (!url) return;
    currentChannel = c;
    $("playerTitle").textContent = nameOf(c);
    $("channelNumber").textContent = channelCode(c);
    addRecent(c);
    renderChannels();
    destroyHls();
    resetQuality();

    video.pause();
    video.removeAttribute("src");
    video.load();
    frame.style.display = "none";
    frame.src = "about:blank";
    video.style.display = "block";

    const yt = youtubeEmbed(url);
    if (yt) {
      video.style.display = "none";
      frame.style.display = "block";
      frame.src = yt;
      status("YouTube Live লোড হচ্ছে: " + nameOf(c));
    } else if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker:true });
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (hls && hls.levels) {
          hls.levels.forEach((level, i) => {
            const o = document.createElement("option");
            o.value = String(i);
            o.textContent = level.height ? level.height + "p" : "Quality " + (i + 1);
            quality.appendChild(o);
          });
        }
        video.play().catch(() => status("Play চাপো: " + nameOf(c)));
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          status("স্ট্রিম চালানো যাচ্ছে না। URL বা নেটওয়ার্ক পরীক্ষা করো।");
          destroyHls();
        }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      status("লোড হচ্ছে: " + nameOf(c));
    } else {
      video.src = url;
      video.load();
      video.play().catch(() => status("Play চাপো: " + nameOf(c)));
      status("লোড হচ্ছে: " + nameOf(c));
    }

    $("heroTitle").textContent = nameOf(c);
    $("heroText").textContent = categoryOf(c) + " • CSTV Live";
    if (fromUser) {
      tryLandscape();
      if (autoFullscreen) requestFullscreen();
    }
  }

  function adjacent(dir) {
    if (!channels.length) return;
    const base = visibleChannels.length ? visibleChannels : channels;
    let i = base.findIndex(c => currentChannel && urlOf(c) === urlOf(currentChannel));
    i = i < 0 ? 0 : (i + dir + base.length) % base.length;
    playChannel(base[i], true);
  }

  function tuneNumber(value) {
    const n = Number(value);
    if (!Number.isInteger(n) || n < 1 || n > channels.length) {
      toast("এই নম্বরের চ্যানেল নেই");
      return;
    }
    closeNumberPad();
    playChannel(channels[n - 1], true);
  }

  function openNumberPad() {
    $("numberPad").style.display = "block";
    numberBuffer = "";
    updateNumberDisplay();
    $("numberDisplay").textContent = "---";
  }
  function closeNumberPad() {
    $("numberPad").style.display = "none";
    numberBuffer = "";
    clearTimeout(numberTimer);
  }
  function updateNumberDisplay() {
    $("numberDisplay").textContent = numberBuffer ? numberBuffer.padStart(3, "0") : "---";
  }
  function addDigit(d) {
    if (d === "clear") numberBuffer = "";
    else if (d === "back") numberBuffer = numberBuffer.slice(0,-1);
    else if (numberBuffer.length < 3) numberBuffer += d;
    updateNumberDisplay();
    clearTimeout(numberTimer);
    if (numberBuffer.length === 3) numberTimer = setTimeout(() => tuneNumber(numberBuffer), 650);
  }

  $("numberBtn").onclick = openNumberPad;
  document.querySelectorAll("[data-digit]").forEach(b => {
    b.onclick = () => addDigit(b.dataset.digit);
  });
  $("padCancel").onclick = closeNumberPad;
  $("padGo").onclick = () => numberBuffer && tuneNumber(numberBuffer);

  $("allBtn").onclick = () => { viewMode = "all"; renderChannels(); };
  $("favoritesBtn").onclick = () => { viewMode = "favorites"; renderChannels(); };
  $("recentBtn").onclick = () => { viewMode = "recent"; renderChannels(); };
  $("refreshBtn").onclick = loadChannels;
  $("search").addEventListener("input", renderChannels);
  $("searchClear").onclick = () => { $("search").value = ""; renderChannels(); };
  $("prevBtn").onclick = () => adjacent(-1);
  $("nextBtn").onclick = () => adjacent(1);
  $("heroPlay").onclick = () => {
    if (currentChannel) {
      $("player").scrollIntoView({behavior:"smooth"});
      video.play().catch(() => {});
    } else if (channels.length) playChannel(channels[0], true);
  };
  $("heroRandom").onclick = () => {
    if (channels.length) playChannel(channels[Math.floor(Math.random()*channels.length)], true);
  };

  $("autoFullBtn").onclick = () => {
    autoFullscreen = !autoFullscreen;
    try { localStorage.setItem("cstv_auto_fullscreen", String(autoFullscreen)); } catch (_) {}
    updateButtons();
    if (autoFullscreen && currentChannel) {
      tryLandscape();
      requestFullscreen();
    }
    toast("Auto Fullscreen " + (autoFullscreen ? "চালু" : "বন্ধ"));
  };

  $("playBtn").onclick = () => {
    if (frame.style.display === "block") {
      toast("YouTube ভিডিওর নিজের Play কন্ট্রোল ব্যবহার করো");
      return;
    }
    if (video.paused) video.play().catch(() => toast("এই স্ট্রিমটি চালানো যাচ্ছে না"));
    else video.pause();
  };

  video.addEventListener("play", () => {
    $("playBtn").textContent = "⏸ Pause";
    status("চলছে: " + (currentChannel ? nameOf(currentChannel) : "Live TV"));
    showControls();
  });
  video.addEventListener("pause", () => {
    $("playBtn").textContent = "▶ Play";
    showControls();
  });
  video.addEventListener("waiting", () => status("বাফার হচ্ছে..."));
  video.addEventListener("playing", () => status("চলছে: " + (currentChannel ? nameOf(currentChannel) : "Live TV")));
  video.addEventListener("error", () => {
    if (video.style.display !== "none") status("ভিডিও চালাতে সমস্যা। স্ট্রিম URL পরীক্ষা করো।");
  });

  quality.onchange = () => {
    if (hls) hls.currentLevel = Number(quality.value);
  };

  $("fullBtn").onclick = async () => {
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) {}
    } else {
      tryLandscape();
      requestFullscreen();
    }
  };

  function showControls() {
    clearTimeout(overlayTimer);
    overlay.classList.remove("hidden");
    if (!video.paused) {
      overlayTimer = setTimeout(() => {
        if (!video.paused) overlay.classList.add("hidden");
      }, 5000);
    }
  }
  stage.addEventListener("mousemove", showControls);
  stage.addEventListener("touchstart", showControls);
  stage.addEventListener("click", showControls);

  document.addEventListener("keydown", e => {
    const active = document.activeElement;
    const tag = active && active.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
      if (e.key === "Escape") active.blur();
      return;
    }

    if ($("numberPad").style.display === "block") {
      if (/^\d$/.test(e.key)) addDigit(e.key);
      else if (e.key === "Backspace") addDigit("back");
      else if (e.key === "Escape") closeNumberPad();
      else if (e.key === "Enter" && numberBuffer) tuneNumber(numberBuffer);
      e.preventDefault();
      return;
    }

    if (/^\d$/.test(e.key)) {
      numberBuffer += e.key;
      if (numberBuffer.length > 3) numberBuffer = e.key;
      clearTimeout(numberTimer);
      numberTimer = setTimeout(() => {
        if (numberBuffer) tuneNumber(numberBuffer);
      }, 900);
      return;
    }

    if (e.key === "ArrowRight" || e.key === "ChannelUp") {
      e.preventDefault(); adjacent(1);
    } else if (e.key === "ArrowLeft" || e.key === "ChannelDown") {
      e.preventDefault(); adjacent(-1);
    } else if (e.key === "ArrowUp") {
      if (currentChannel) adjacent(1);
    } else if (e.key === "ArrowDown") {
      if (currentChannel) adjacent(-1);
    } else if (e.key.toLowerCase() === "f") {
      requestFullscreen();
    } else if (e.key === "Escape") {
      closeNumberPad();
    } else if (e.key === "Enter" && currentChannel) {
      video.play().catch(() => {});
    }
  });

  async function loadChannels() {
    status("চ্যানেল লোড হচ্ছে...");
    try {
      const response = await fetch("./channels.json?v=" + Date.now(), {cache:"no-store"});
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      const list = Array.isArray(data) ? data : data.channels;
      if (!Array.isArray(list)) throw new Error("Invalid channels.json");

      channels = list.filter(c => c && urlOf(c));
      currentCategory = "সব";
      renderCategories();
      renderChannels();

      if (channels.length) {
        status(channels.length + "টি চ্যানেল লোড হয়েছে।");
        $("heroText").textContent = channels.length + "টি Live TV Channel • CSTV";
        if (!currentChannel) {
          // Load the first channel; autoplay depends on browser permission.
          playChannel(channels[0], false);
        }
        loadLogoCatalogue();
      } else {
        status("channels.json-এ কোনো বৈধ চ্যানেল পাওয়া যায়নি।");
      }
    } catch (err) {
      console.error(err);
      status("চ্যানেল লোড হয়নি। channels.json এবং GitHub Pages পরীক্ষা করো।");
      toast("Channel list load failed");
    }
  }

  // Make the page easier to operate with a TV remote.
  const ua = navigator.userAgent || "";
  const isTV = /Android TV|GoogleTV|SmartTV|SMART-TV|AFT|BRAVIA|TV;/i.test(ua);
  if (isTV) document.body.classList.add("tvMode");

  updateButtons();
  loadChannels();
})();
</script>
</body>
</html>
