
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>CS TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#080b12;--panel:#151d29;--green:#20d997;--blue:#2997ff}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
button,select,input{font:inherit}
button,select{background:#202b3a;color:#fff;border:1px solid #ffffff20;border-radius:9px;padding:10px 13px}
button:focus,select:focus,input:focus,.channel:focus{outline:3px solid var(--blue);outline-offset:2px}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #ffffff14}
.brand{font-size:24px;font-weight:900}.brand span{color:var(--green)}
input{width:min(44%,300px);padding:10px 13px;background:#17212e;color:white;border:1px solid #35445a;border-radius:10px}
main{max-width:1400px;margin:auto;padding:22px 5%}
.hero{padding:28px;border-radius:20px;background:radial-gradient(ellipse at 90% 10%,#126b50,transparent 45%),linear-gradient(110deg,#17302f,#101827);margin-bottom:24px}
.live{display:inline-block;background:#dc2346;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:bold}
.hero h1{font-size:clamp(32px,5vw,50px);margin:13px 0}
.hero p{color:#c7d4dc}
.green{background:var(--green);color:#06140e;border:0;font-weight:bold}
h2{font-size:21px;margin:25px 0 13px}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 2px 12px}
.categories button{white-space:nowrap;border-radius:24px}
.categories .active{background:var(--green);color:#06140e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
.channel{background:var(--panel);border:1px solid #273649;border-radius:13px;padding:12px;cursor:pointer}
.channel:hover,.channel:focus{border-color:var(--green)}
.logo{height:83px;background:#0a1019;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.logo img{max-width:90%;max-height:72px;object-fit:contain}
.logo b{font-size:20px;color:#b9cbd8}
.name{font-size:14px;font-weight:bold;overflow-wrap:anywhere}
.meta{font-size:11px;color:#aabaca;margin-top:6px}
.player{display:none;background:#101720;padding:10px;border:1px solid #273649;border-radius:15px;margin:18px 0}
.player.show{display:block}
.stage{position:relative;background:#000;aspect-ratio:16/9;max-height:80vh;overflow:hidden;border-radius:10px}
video{width:100%;height:100%;object-fit:contain;background:#000}
.overlay{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(#0009,transparent 30%,transparent 55%,#000c)}
.overlay button,.overlay select{pointer-events:auto;background:#15202ddd}
.bar{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}
.group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#status{font-size:12px;color:#b7c8d8;margin:9px 2px 1px}
body.directMode{overflow:hidden}
body.directMode header,body.directMode main>section:not(#player),body.directMode #browseTitle,body.directMode #categories,body.directMode #grid,body.directMode footer{display:none!important}
body.directMode main{padding:0;max-width:none}
body.directMode #player{display:block!important;position:fixed;inset:0;z-index:50;margin:0;padding:0;border:0;border-radius:0;background:#000}
body.directMode .stage{width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0}
body.directMode video{width:100%;height:100%;object-fit:contain}
body.directMode .playerhead{position:absolute;z-index:2;top:8px;left:10px;right:10px}
body.directMode .playerhead h2{margin:0;font-size:15px;text-shadow:0 1px 4px black}
body.directMode .playerhead button{background:#171c26dd}
body.directMode #status{position:absolute;bottom:2px;left:10px;z-index:3}
@media(max-width:550px){
 header{padding:0 4%}main{padding:15px 4%}.hero{padding:22px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .overlay{padding:6px}.overlay button,.overlay select{font-size:11px;padding:7px}
}
</style>
</head>
<body>
<header>
 <div class="brand">CS <span>TV</span></div>
 <input id="search" type="search" placeholder="⌕ Search channels">
</header>
<main>
<section class="hero">
 <span class="live">● LIVE TV</span>
 <h1>Bangla TV Hub</h1>
 <p>বাংলাদেশের প্রিয় চ্যানেল, এক জায়গায়।</p>
 <button class="green" onclick="browse()">▶ Browse Channels</button>
</section>

<section id="player" class="player">
 <div class="playerhead bar" style="padding:2px 2px 10px">
  <h2 id="playingTitle">CS TV Player</h2>
  <button onclick="closePlayer()">✕ Close</button>
 </div>
 <div id="stage" class="stage">
  <video id="video" playsinline autoplay></video>
  <div class="overlay">
   <div class="bar">
    <div class="group">
     <button onclick="previousChannel()">⏮ Previous</button>
     <button onclick="nextChannel()">Next ⏭</button>
    </div>
    <strong id="overlayTitle">CS TV</strong>
   </div>
   <div class="bar">
    <div class="group">
     <button id="playButton" onclick="togglePlay()">▶ Play</button>
     <select id="quality" onchange="setQuality(this.value)">
      <option value="-1">Quality: Auto</option>
     </select>
    </div>
    <div class="group">
     <button onclick="toggleFullscreen()">⛶ Full Screen</button>
     <button onclick="browse()">☷ Channels</button>
    </div>
   </div>
  </div>
 </div>
 <div id="status">Loading channel list...</div>
</section>

<h2 id="browseTitle">📺 Live Channels</h2>
<nav class="categories" id="categories">
 <button class="active" data-cat="All">All</button>
 <button data-cat="Bangla">🇧🇩 Bangla</button>
 <button data-cat="Sports">⚽ Sports</button>
 <button data-cat="News">📰 News</button>
 <button data-cat="International">🌍 International</button>
 <button data-cat="Entertainment">🎬 Entertainment</button>
</nav>
<div id="grid">Loading channels...</div>
</main>
<footer style="text-align:center;color:#78889b;padding:20px">CS TV · Bangla TV Hub</footer>

<script>
const $=id=>document.getElementById(id);
const video=$('video');
const ua=navigator.userAgent||'';
const isWebView=/\bwv\b|Version\/[\d.]+.*Chrome\/[\d.]+.*Mobile/i.test(ua);
let channels=[],visible=[],current=-1,activeCategory='All',hls=null;
let directMode=isWebView;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function categoryOf(c){
 const s=String(c.category||'Bangla').toLowerCase();
 if(s.includes('sport'))return 'Sports';
 if(s.includes('news'))return 'News';
 if(s.includes('international'))return 'International';
 if(s.includes('entertain'))return 'Entertainment';
 return c.category||'Bangla';
}
function setDirectMode(on){
 directMode=on;
 document.body.classList.toggle('directMode',on);
}
async function loadChannels(){
 try{
  const r=await fetch('./channels.json?v='+Date.now());
  if(!r.ok)throw Error('channels.json missing');
  const d=await r.json();
  channels=Array.isArray(d)?d:d.channels;
  if(!Array.isArray(channels))throw Error('Invalid channel list');
  channels=channels.filter(c=>c&&c.name&&c.url);
  render();
  const last=Number(localStorage.getItem('cstv_last_channel'));
  if(directMode&&channels.length){
   const first=Number.isInteger(last)&&last>=0&&last<channels.length?last:0;
   visible=channels.slice();
   playChannel(first,true);
  }
 }catch(e){$('grid').textContent='channels.json লোড হয়নি। ফাইলটি index.html-এর পাশেই আছে কি না দেখো।';$('status').textContent='Channel list unavailable.'}
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 visible=channels.filter(c=>(activeCategory==='All'||categoryOf(c).toLowerCase()===activeCategory.toLowerCase())&&String(c.name).toLowerCase().includes(q));
 if(!visible.length){$('grid').textContent='No channels found.';return}
 $('grid').className='grid';
 $('grid').innerHTML=visible.map((c,i)=>`<div class="channel" tabindex="0" role="button" data-i="${i}">
 <div class="logo">${c.logo?`<img src="${esc(c.logo)}" alt="${esc(c.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<b style="${c.logo?'display:none':''}">${esc(String(c.name).slice(0,3).toUpperCase())}</b></div>
 <div class="name">${esc(c.name)}</div><div class="meta">${esc(categoryOf(c))}</div></div>`).join('');
 $('grid').querySelectorAll('.channel').forEach(el=>{
  const go=()=>playChannel(Number(el.dataset.i),false);
  el.addEventListener('click',go);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
 });
}
function resetQuality(){$('quality').innerHTML='<option value="-1">Quality: Auto</option>'}
function populateQuality(){
 resetQuality();if(!hls||!hls.levels.length)return;
 const seen=new Set();
 hls.levels.map((l,i)=>({i,h:l.height||0})).sort((a,b)=>b.h-a.h).forEach(l=>{
  if(!l.h||seen.has(l.h))return;seen.add(l.h);
  const o=document.createElement('option');o.value=l.i;o.textContent='Quality: '+l.h+'p';$('quality').appendChild(o);
 });
}
function setQuality(v){
 if(!hls||!hls.levels.length){$('status').textContent='Quality selection unavailable for this stream.';return}
 hls.currentLevel=Number(v);
 $('status').textContent=Number(v)<0?'Quality: Auto':'Quality: '+hls.levels[Number(v)].height+'p';
}
function playChannel(i,auto=false){
 const c=visible[i];if(!c)return;
 current=i;
 try{localStorage.setItem('cstv_last_channel',String(channels.findIndex(x=>x.url===c.url)))}catch(e){}
 $('player').classList.add('show');
 $('playingTitle').textContent=c.name;$('overlayTitle').textContent=c.name;
 $('status').textContent='Connecting to '+c.name+'...';
 resetQuality();
 if(hls){hls.destroy();hls=null}
 video.pause();video.removeAttribute('src');video.load();
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(c.url);hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
   populateQuality();
   video.play().then(()=>{
    $('status').textContent='Playing: '+c.name;
    if(auto&&directMode)tryFullscreen();
   }).catch(()=>{
    $('status').textContent='Autoplay blocked. Press OK or Play to start.';
   });
  });
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('status').textContent='Stream error. Try another channel.'});
 }else if(video.canPlayType('application/vnd.apple.mpegurl')){
  video.src=c.url;
  video.play().then(()=>{
   $('status').textContent='Playing: '+c.name;
   if(auto&&directMode)tryFullscreen();
  }).catch(()=>$('status').textContent='Press OK or Play to start.');
 }else{$('status').textContent='This browser does not support this stream format.'}
 if(!directMode)$('player').scrollIntoView({behavior:'smooth',block:'start'});
}
function nextChannel(){if(visible.length)playChannel((current+1+visible.length)%visible.length)}
function previousChannel(){if(visible.length)playChannel((current-1+visible.length)%visible.length)}
function togglePlay(){if(video.paused)video.play().catch(()=>{});else video.pause()}
function closePlayer(){video.pause();if(hls){hls.destroy();hls=null}$('player').classList.remove('show');if(directMode)browse()}
function tryFullscreen(){
 const stage=$('stage');
 if(stage.requestFullscreen)stage.requestFullscreen().catch(()=>{});
 else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
}
function toggleFullscreen(){
 if(document.fullscreenElement)document.exitFullscreen?.();
 else tryFullscreen();
}
function browse(){
 setDirectMode(false);
 $('browseTitle').scrollIntoView({behavior:'smooth',block:'start'});
}
$('search').addEventListener('input',render);
$('categories').addEventListener('click',e=>{
 const b=e.target.closest('button[data-cat]');if(!b)return;
 activeCategory=b.dataset.cat;
 $('categories').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
 render();
});
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,select'))return;
 if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();nextChannel()}
 else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();previousChannel()}
 else if(e.key==='Enter'){e.preventDefault();togglePlay()}
 else if(e.key==='f'||e.key==='F')toggleFullscreen();
});
video.addEventListener('play',()=>$('playButton').textContent='⏸ Pause');
video.addEventListener('pause',()=>$('playButton').textContent='▶ Play');
loadChannels();
</script>
</body>
</html>
