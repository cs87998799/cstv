<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U Playlist Video Player</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for playing m3u8 streams in web browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-gray-800 rounded-lg shadow-xl p-6">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-400">IPTV M3U Stream Player</h1>
        
        <!-- Channel Selector -->
        <div class="mb-4">
            <label for="channelSelect" class="block text-sm font-medium text-gray-300 mb-2">চ্যানেল সিলেক্ট করুন:</label>
            <select id="channelSelect" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-indigo-500">
                <option value="">প্লেলিস্ট লোড হচ্ছে...</option>
            </select>
        </div>

        <!-- Video Player -->
        <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden shadow-inner">
            <video id="videoPlayer" controls autoplay class="w-full h-full"></video>
        </div>
        
        <p id="status" class="text-xs text-gray-400 mt-3 text-center"></p>
    </div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u";
        const channelSelect = document.getElementById('channelSelect');
        const video = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');
        
        let channels = [];
        let hls;

        // M3U ফাইল ফেচ করে পার্স করা
        async function loadPlaylist() {
            try {
                statusText.innerText = "প্লেলিস্ট ডাউনলোড করা হচ্ছে...";
                const response = await fetch(m3uUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error("Error loading M3U:", error);
                statusText.innerText = "প্লেলিস্ট লোড করতে সমস্যা হয়েছে! CORS পলিসির কারণে লোকাল ব্রাউজারে সমস্যা হতে পারে।";
            }
        }

        // M3U ফাইল থেকে চ্যানেল নাম এবং লিংক আলাদা করা
        function parseM3U(data) {
            const lines = data.split('\n');
            channels = [];
            let currentTitle = '';

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // এক্সটিনফ থেকে চ্যানেলের নাম বের করা (কমা-এর পরের অংশ)
                    const parts = line.split(',');
                    currentTitle = parts.length > 1 ? parts[1] : 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    // এটি ভিডিও লিংক
                    channels.push({ title: currentTitle, url: line });
                    currentTitle = '';
                }
            }

            populateDropdown();
        }

        // ড্রপডাউনে অপশন যোগ করা
        function populateDropdown() {
            channelSelect.innerHTML = '<option value="">-- একটি চ্যানেল বেছে নিন --</option>';
            if (channels.length === 0) {
                statusText.innerText = "কোনো চ্যানেল পাওয়া যায়নি।";
                return;
            }

            channels.forEach((ch, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = ch.title;
                channelSelect.appendChild(option);
            });

            statusText.innerText = `মোট ${channels.length} টি চ্যানেল পাওয়া গেছে।`;
        }

        // চ্যানেল পরিবর্তন করলে ভিডিও চালানো
        channelSelect.addEventListener('change', (e) => {
            const index = e.target.value;
            if (index === "") return;

            const selectedChannel = channels[index];
            playStream(selectedChannel.url);
        });

        function playStream(url) {
            statusText.innerText = `প্লে হচ্ছে: ${url}`;
            
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari ব্রাউজারের জন্য নেটিভ সাপোর্ট
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            } else {
                statusText.innerText = "আপনার ব্রাউজার এই ফরম্যাট সাপোর্ট করে না।";
            }
        }

        // পেজ লোড হলে প্লেলিস্ট ফেচ করা শুরু হবে
        loadPlaylist();
    </script>
</body>
</html>
