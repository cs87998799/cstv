<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusbu TV</title>
    <!-- Video.js & HLS.js for universal video format & YouTube support -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3.13.0/dist/videojs-http-streaming.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }
        
        #app { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* Sidebar Styles */
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 10; transition: transform 0.3s ease; }
        .sidebar.hidden { transform: translateX(-100%); }
        .brand { padding: 20px; font-size: 1.5rem; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        
        .search-box { padding: 12px; border-bottom: 1px solid #334155; }
        .search-box input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; outline: none; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { display: flex; align-items: center; padding: 10px; margin-bottom: 8px; background: #0f172a; border-radius: 8px; cursor: pointer; transition: background 0.2s, border 0.2s; border: 2px solid transparent; }
        .channel-item:hover, .channel-item.selected { background: #334155; border-color: #38bdf8; }
        .channel-item img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; margin-right: 12px; background: #475569; }
        .channel-info h4 { font-size: 0.95rem; margin-bottom: 4px; }
        .channel-info p { font-size: 0.75rem; color: #94a3b8; }

        /* Main Content Styles */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; }
        
        .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 5; transition: opacity 0.3s; }
        .btn { background: rgba(30, 41, 59, 0.8); border: 1px solid #475569; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(5px); }
        .btn:hover { background: #38bdf8; color: #000; border-color: #38bdf8; }

        /* Video Container */
        .video-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        video, #youtube-player { width: 100%; height: 100%; object-fit: contain; }
        #youtube-player-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }

        /* Mini Channel Popup (Now Smaller & Shows Nearby Channels, Auto-hide 3s) */
        .channel-popup {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .channel-popup.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .popup-item {
            width: 75px;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            background: #1e293b;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .popup-item.active { border-color: #38bdf8; background: #334155; }
        .popup-item img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }
        .popup-item span { font-size: 0.7rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

        /* Settings Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; border: 1px solid #475569; width: 450px; border-radius: 12px; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .setting-group { margin-bottom: 16px; }
        .setting-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        .setting-group select, .setting-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="brand">
                <span>Khusbu TV</span>
                <button class="btn" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search channels..." oninput="filterChannels()">
            </div>
            <div class="channel-list" id="channelList">
                <!-- Channels populated by JS -->
            </div>
        </div>

        <!-- Main Player Area -->
        <div class="main-content" id="mainContent" onclick="handleScreenClick()">
            <div class="top-bar" id="topBar">
                <button class="btn" onclick="toggleSidebar(); event.stopPropagation();">☰ Channels</button>
                <h3 id="currentChannelTitle" style="font-size: 1rem;">Select a Channel</h3>
                <button class="btn" onclick="openSettings(); event.stopPropagation();">⚙️ Settings</button>
            </div>

            <div class="video-container">
                <!-- Universal Video Player (Supports MP4, HLS, M3U8, etc.) -->
                <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
                <!-- YouTube Iframe Container -->
                <div id="youtube-player-container">
                    <div id="yt-player"></div>
                </div>
            </div>

            <!-- Nearby Channels Popup (Small, Auto-hide 3s) -->
            <div class="channel-popup" id="channelPopup" onclick="event.stopPropagation()">
                <!-- Populated dynamically with current + neighboring channels -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="btn" onclick="closeSettings()">✕</button>
            </div>
            <div class="setting-group">
                <label>Video Aspect Ratio</label>
                <select id="aspectRatioSetting" onchange="updateAspectRatio()">
                    <option value="contain">Contain (16:9 Fit)</option>
                    <option value="cover">Cover (Fill Screen)</option>
                    <option value="fill">Fill (Stretch)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Default Volume</label>
                <input type="range" id="volumeSetting" min="0" max="100" value="80" oninput="updateVolume()">
            </div>
            <div class="setting-group">
                <label>Auto Stream Switch on Error</label>
                <select id="autoSwitchSetting">
                    <option value="true">Enabled (Silent Retry/Switch)</option>
                    <option value="false">Disabled</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // Sample Channels Data (Supports M3U8, MP4, and YouTube links)
        const channels = [
            { id: 1, name: "Big Buck Bunny (MP4)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", logo: "https://via.placeholder.com/45", type: "video" },
            { id: 2, name: "Tears of Steel (MP4)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", logo: "https://via.placeholder.com/45", type: "video" },
            { id: 3, name: "NASA TV Live (YouTube)", url: "https://www.youtube.com/watch?v=21X5lGlDOfg", logo: "https://via.placeholder.com/45", type: "youtube" },
            { id: 4, name: "Sintel (MP4)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", logo: "https://via.placeholder.com/45", type: "video" },
            { id: 5, name: "Elephants Dream (MP4)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", logo: "https://via.placeholder.com/45", type: "video" }
        ];

        let currentIndex = 0;
        let player = null;
        let ytPlayer = null;
        let popupTimer = null;
        let settings = {
            aspectRatio: 'contain',
            volume: 0.8,
            autoSwitch: true
        };

        window.addEventListener('DOMContentLoaded', () => {
            player = videojs('videoPlayer', {
                fluid: false,
                autoplay: true,
                controls: true
            });

            player.on('error', () => {
                if(settings.autoSwitch) {
                    console.warn("Stream error detected, switching to next channel...");
                    setTimeout(nextChannel, 2000);
                }
            });

            renderChannels();
            playChannel(0);
        });

        function renderChannels(filter = "") {
            const list = document.getElementById('channelList');
            list.innerHTML = "";
            channels.forEach((ch, idx) => {
                if(ch.name.toLowerCase().includes(filter.toLowerCase())) {
                    const item = document.createElement('div');
                    item.className = `channel-item ${idx === currentIndex ? 'selected' : ''}`;
                    item.onclick = () => playChannel(idx);
                    item.innerHTML = `
                        <img src="${ch.logo}" alt="">
                        <div class="channel-info">
                            <h4>${ch.name}</h4>
                            <p>${ch.type.toUpperCase()}</p>
                        </div>
                    `;
                    list.appendChild(item);
                }
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value;
            renderChannels(query);
        }

        function playChannel(index) {
            currentIndex = index;
            const ch = channels[currentIndex];
            document.getElementById('currentChannelTitle').innerText = ch.name;
            
            // Highlight in sidebar
            document.querySelectorAll('.channel-item').forEach((el, i) => {
                el.classList.toggle('selected', i === currentIndex);
            });

            const videoElement = document.getElementById('videoPlayer').parentElement;
            const ytContainer = document.getElementById('youtube-player-container');

            if (ch.type === 'youtube') {
                videoElement.style.display = 'none';
                ytContainer.style.display = 'block';
                const ytId = extractYouTubeId(ch.url);
                if(ytPlayer) {
                    ytPlayer.loadVideoById(ytId);
                } else {
                    onYouTubeIframeAPIReady(ytId);
                }
            } else {
                ytContainer.style.display = 'none';
                videoElement.style.display = 'flex';
                player.src({ src: ch.url, type: ch.url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
                player.play().catch(e => console.log("Autoplay prevented:", e));
            }

            showPopupWithNearby();
        }

        function extractYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady(videoId) {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 1, 'controls': 1 },
            });
        }

        // Show Current + Nearby Channels in a compact popup, auto-hide in 3s
        function showPopupWithNearby() {
            const popup = document.getElementById('channelPopup');
            popup.innerHTML = "";

            // Determine nearby indices (Previous, Current, Next)
            let prevIndex = (currentIndex - 1 + channels.length) % channels.length;
            let nextIndex = (currentIndex + 1) % channels.length;
            
            const indicesToShow = [prevIndex, currentIndex, nextIndex];

            indicesToShow.forEach(idx => {
                const ch = channels[idx];
                const div = document.createElement('div');
                div.className = `popup-item ${idx === currentIndex ? 'active' : ''}`;
                div.onclick = () => playChannel(idx);
                div.innerHTML = `
                    <img src="${ch.logo}" alt="">
                    <span>${ch.name}</span>
                `;
                popup.appendChild(div);
            });

            popup.classList.add('visible');

            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                popup.classList.remove('visible');
            }, 3000); // 3 Seconds Auto-Hide
        }

        function handleScreenClick() {
            const popup = document.getElementById('channelPopup');
            popup.classList.add('visible');
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                popup.classList.remove('visible');
            }, 3000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        // Settings Logic
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function updateAspectRatio() {
            const val = document.getElementById('aspectRatioSetting').value;
            settings.aspectRatio = val;
            const vEl = document.getElementById('videoPlayer');
            vEl.style.objectFit = val;
        }

        function updateVolume() {
            const val = document.getElementById('volumeSetting').value;
            settings.volume = val / 100;
            player.volume(settings.volume);
        }

        // Keyboard navigation support for TV D-pad/Remote Arrow Keys
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowUp') {
                let newIdx = (currentIndex - 1 + channels.length) % channels.length;
                playChannel(newIdx);
            } else if(e.key === 'ArrowDown') {
                let newIdx = (currentIndex + 1) % channels.length;
                playChannel(newIdx);
            } else if(e.key === 'ArrowLeft') {
                toggleSidebar();
            }
        });
    </script>
</body>
</html>
