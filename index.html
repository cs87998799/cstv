<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CSTV – Live TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--red:#e50914;--bg:#000;--card:#181818;--line:#2a2a2a;--tx:#fff;--mut:#b3b3b3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:28px;padding:calc(14px + env(safe-area-inset-top,0px)) 4% 14px;background:linear-gradient(#000e,#0000);transition:background .25s}
header.s{background:#000}
.logo{font-family:"Bebas Neue";font-size:38px;color:var(--red);letter-spacing:1px;line-height:1}
nav{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
nav button{font-size:15px;color:#e5e5e5;white-space:nowrap;padding:4px 0}
nav button.on{font-weight:700;color:#fff;border-bottom:2px solid var(--red)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid transparent;padding:6px 10px;border-radius:4px;background:#0006}
.search input{width:0;background:none;border:0;color:#fff;font:inherit;font-size:14px;outline:0;transition:width .25s}
.search:focus-within{border-color:#fff;background:#000}
.search:focus-within input,.search input:not(:placeholder-shown){width:200px}
.hero{position:relative;min-height:68vh;display:flex;align-items:flex-end;padding:0 4% 70px;background:radial-gradient(ellipse at 75% 20%,#e5091466,transparent 55%),linear-gradient(160deg,#2b0407,#0c0c0c 70%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(#0000,#000)}
.hero>div{position:relative;z-index:1;max-width:560px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 #e50914aa;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px #e5091400}}
.hero h1{font-family:"Bebas Neue";font-size:clamp(48px,9vw,96px);line-height:.95;font-weight:400;margin:8px 0 10px}
.hero p{color:#ddd;font-size:16px;margin-bottom:20px}
.b{display:inline-flex;align-items:center;gap:8px;padding:10px 26px;border-radius:4px;font-weight:700;font-size:16px;margin-right:10px}
.b.w{background:#fff;color:#000}.b.g{background:#6d6d6eb3}
.b.w:hover{background:#ffffffbb}
main{margin-top:-40px;position:relative;z-index:2;padding-bottom:40px}
.page{padding-top:90px}
.sec{margin-top:26px}
.sec h2{font-size:20px;font-weight:600;padding:0 4%;margin-bottom:10px}
.row{display:flex;gap:8px;overflow-x:auto;padding:14px 4% 24px;scrollbar-width:none;scroll-snap-type:x proximity}
.row.wrap{flex-wrap:wrap}
.t{flex:none;width:210px;scroll-snap-align:start;position:relative;transition:transform .2s;cursor:pointer}
.t:hover,.t:focus-visible{transform:scale(1.1);z-index:5}
.img{aspect-ratio:16/10;border-radius:4px;background:linear-gradient(145deg,#262626,#111);display:grid;place-items:center;overflow:hidden}
.img img{width:62%;height:62%;object-fit:contain}
.img span{font-family:"Bebas Neue";font-size:44px;color:#555}
.t b{display:block;font-size:14px;font-weight:500;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{position:absolute;top:7px;left:7px;background:var(--red);font-size:10px;font-weight:700;padding:1px 7px;border-radius:2px}
.fav{position:absolute;top:2px;right:4px;font-size:20px;color:#fff9;text-shadow:0 1px 3px #000}
.fav.on{color:#ffd54a}
.empty{color:var(--mut);text-align:center;padding:70px 20px;line-height:1.8}
#pl{position:fixed;inset:0;background:#000;z-index:50;display:none}
#pl.on{display:block}
#v{width:100%;height:100%;background:#000}
.pt{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 30px;background:linear-gradient(#000c,#0000);transition:opacity .3s}
.pt b{font-size:20px}
.pt .bk{font-size:26px;width:40px;height:40px}
.pt .lst{margin-left:auto;background:#fff2;padding:8px 16px;border-radius:4px;font-size:14px}
#pl.h .pt{opacity:0;pointer-events:none}
#msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:#ff8a8f;line-height:1.7;background:#000c}
#msg.on{display:grid}
#dr{position:absolute;top:0;right:0;bottom:0;width:300px;background:#0d0d0df2;transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:70px 0 20px}
#dr.on{transform:none}
#dr button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 18px;font-size:14px}
#dr button:hover{background:#ffffff14}
#dr button.cur{border-left:3px solid var(--red);background:#ffffff1a}
#dr img,#dr i{width:44px;height:30px;object-fit:contain;flex:none;font:normal 600 16px "Bebas Neue";color:#777;text-align:center;line-height:30px}
@media (max-width:760px){
 header{gap:14px;flex-wrap:wrap;row-gap:8px}
 nav{order:3;width:100%;gap:16px}
 .search:focus-within input,.search input:not(:placeholder-shown){width:130px}
 .hero{min-height:58vh;padding-bottom:50px}
 .t{width:150px}
 .page{padding-top:110px}
 #dr{top:auto;width:100%;height:55%;transform:translateY(100%);border-radius:14px 14px 0 0;padding-top:16px}
 #dr.on{transform:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd">
 <div class="logo">CSTV</div>
 <nav id="nav"></nav>
 <label class="search"><span>🔍</span><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search channels"></label>
</header>
<main id="app"><div class="empty page">Loading channels…</div></main>

<div id="pl" role="dialog" aria-modal="true" aria-label="Player">
 <video id="v" controls autoplay playsinline></video>
 <div id="msg"></div>
 <div class="pt"><button class="bk" id="px" aria-label="Back">←</button><span class="live">LIVE</span><b id="pt"></b><button class="lst" id="pd">Channels</button></div>
 <div id="dr"></div>
</div>

<script>
// Local file or raw GitHub link: "https://raw.githubusercontent.com/USERNAME/REPO/main/channels.json"
const CHANNELS_URL = "channels.json";

const NAV = [["home","Home"],["live","Live TV"],["sports","Sports"],["movies","Movies"],["entertainment","Entertainment"],["news","News"],["kids","Kids"],["islamic","Islamic"],["__fav","My List"]];
let ALL = [], cur = "home", term = "", hls = null, now = -1, favs = [];
try { favs = JSON.parse(localStorage.getItem("cstv_favs") || "[]"); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cat = c => String(c.category || c.group || "Live TV").trim();
const key = c => c.name + "|" + c.url;

function nav() {
  $("#nav").innerHTML = NAV.map(n => `<button data-k="${n[0]}" class="${n[0]===cur?"on":""}">${n[1]}</button>`).join("");
}
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) { cur = b.dataset.k; scrollTo(0,0); nav(); render(); } };
$("#q").oninput = e => { term = e.target.value.trim().toLowerCase(); render(); };
addEventListener("scroll", () => $("#hd").classList.toggle("s", scrollY > 30), {passive:true});
nav();

fetch(CHANNELS_URL, {cache:"no-store"})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => {
    ALL = (Array.isArray(d) ? d : d.channels || []).map(c => ({...c, url: c.url || c.stream || c.src})).filter(c => c.name && c.url);
    render();
  })
  .catch(() => { $("#app").innerHTML = `<div class="empty page">channels.json load hoyni.<br>File ta index.html er pashe ache kina, ar JSON thik ache kina dekhun.</div>`; });

function tile(c) {
  const i = ALL.indexOf(c), on = favs.includes(key(c));
  const im = c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span>${esc(c.name[0])}</span>'">` : `<span>${esc(c.name[0])}</span>`;
  return `<div class="t" tabindex="0" role="button" data-i="${i}"><div class="img">${im}</div><span class="tg">LIVE</span><button class="fav${on?" on":""}" data-f="${i}" aria-label="My List">${on?"★":"☆"}</button><b>${esc(c.name)}</b></div>`;
}
function sec(title, list, wrap) {
  return list.length ? `<section class="sec"><h2>${esc(title)}</h2><div class="row${wrap?" wrap":""}">${list.map(tile).join("")}</div></section>` : "";
}
function render() {
  let list = term ? ALL.filter(c => (c.name + " " + cat(c)).toLowerCase().includes(term)) : ALL, h = "";
  if (cur === "home" && !term && ALL[0]) {
    const f = ALL[0];
    h += `<div class="hero"><div><span class="live">LIVE NOW</span><h1>${esc(f.name)}</h1><p>${ALL.length} ti channel live dekhun, jekono somoy.</p><button class="b w" data-i="0">▶ Watch Live</button><button class="b g" data-f="0">＋ My List</button></div></div><div style="margin-top:-30px">`;
    h += sec("Live TV", ALL);
    const g = {};
    ALL.forEach(c => (g[cat(c)] = g[cat(c)] || []).push(c));
    Object.keys(g).forEach(k => { if (k.toLowerCase() !== "live tv") h += sec(k, g[k]); });
    h += "</div>";
  } else {
    let t = "Search results";
    if (!term) {
      t = NAV.find(n => n[0] === cur)[1];
      if (cur === "__fav") list = list.filter(c => favs.includes(key(c)));
      else if (cur !== "home" && cur !== "live") list = list.filter(c => cat(c).toLowerCase().includes(t.toLowerCase()));
    }
    h = `<div class="page">${list.length ? sec(t, list, true) : `<div class="empty">${cur==="__fav"&&!term?"Kono channel save kora nei.<br>Channel er ☆ chap dile ekhane joma hobe.":"Kichu pawa jayni."}</div>`}</div>`;
  }
  $("#app").innerHTML = h || `<div class="empty page">Kono channel nei.</div>`;
}
$("#app").onclick = e => {
  const f = e.target.closest("[data-f]");
  if (f) {
    e.stopPropagation();
    const k = key(ALL[f.dataset.f]), x = favs.indexOf(k);
    x < 0 ? favs.push(k) : favs.splice(x, 1);
    try { localStorage.setItem("cstv_favs", JSON.stringify(favs)); } catch (er) {}
    return render();
  }
  const t = e.target.closest("[data-i]");
  if (t) play(+t.dataset.i);
};
$("#app").onkeydown = e => { if (e.key === "Enter" && e.target.dataset.i) play(+e.target.dataset.i); };

// ===== Player =====
const v = $("#v"), msg = $("#msg"), pl = $("#pl"), dr = $("#dr");
let idle;
function fail(t) { msg.textContent = t; msg.classList.add("on"); }
function wake() { pl.classList.remove("h"); clearTimeout(idle); idle = setTimeout(() => { if (!dr.classList.contains("on")) pl.classList.add("h"); }, 3500); }
["mousemove","touchstart","keydown"].forEach(ev => pl.addEventListener(ev, wake, {passive:true}));
function play(i) {
  const c = ALL[i]; if (!c) return;
  now = i; $("#pt").textContent = c.name; msg.classList.remove("on"); dr.classList.remove("on");
  pl.classList.add("on"); wake(); stop(); drawer();
  const u = c.url;
  if (location.protocol === "https:" && u.startsWith("http:")) return fail("Ei stream http link, kintu site https e cholche. Browser eta block kore. Stream er https link bebohar korun.");
  if (u.includes("m3u8")) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({lowLatencyMode: true});
      hls.loadSource(u); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail("Ei channel ekhon chalano jacche na. Stream bondho ba block (CORS) hote pare."); });
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = u; v.play().catch(() => {}); }
    else fail("Ei browser HLS support kore na.");
  } else { v.src = u; v.play().catch(() => {}); v.onerror = () => fail("Ei channel ekhon chalano jacche na."); }
}
function drawer() {
  dr.innerHTML = ALL.map((c, i) => `<button data-p="${i}" class="${i===now?"cur":""}">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : `<i>${esc(c.name[0])}</i>`}${esc(c.name)}</button>`).join("");
}
dr.onclick = e => { const b = e.target.closest("[data-p]"); if (b) play(+b.dataset.p); };
$("#pd").onclick = () => dr.classList.toggle("on");
function stop() { if (hls) { hls.destroy(); hls = null; } v.onerror = null; v.pause(); v.removeAttribute("src"); v.load(); }
function close_() { stop(); pl.classList.remove("on"); dr.classList.remove("on"); }
$("#px").onclick = close_;
addEventListener("keydown", e => { if (e.key === "Escape") close_(); });
</script>
</body>
</html>
