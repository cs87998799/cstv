
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>CS TV | Live Television</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#08090d;--panel:#151720;--text:#f5f5f7;--muted:#9da3b1;--blue:#2997ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#08090dee;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff10}
.brand{font-size:23px;font-weight:800;letter-spacing:-1px}
.brand span{color:var(--blue)}
.search{width:min(40%,280px);background:#1c1e27;border:1px solid #343743;color:white;padding:12px 15px;border-radius:12px;font-size:15px}
main{max-width:1500px;margin:auto;padding:22px 5% 60px}
.hero{min-height:230px;padding:32px;border-radius:22px;background:radial-gradient(ellipse at 85% 20%,#164b7b 0%,transparent 42%),linear-gradient(115deg,#202330,#10131b 65%,#0b1927);display:flex;flex-direction:column;justify-content:center;margin-bottom:28px;overflow:hidden}
.eyebrow{font-size:12px;letter-spacing:3px;color:#75baff;font-weight:bold}
.hero h1{font-size:clamp(30px,5vw,52px);margin:12px 0}
.hero p{color:#c5cad4;margin:0 0 22px}
button{cursor:pointer;color:white;background:#222530;border:1px solid #ffffff12;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600}
button:focus,input:focus{outline:2px solid var(--blue);outline-offset:3px}
.primary{background:white;color:#101116;border:0}
.section-title{font-size:21px;margin:28px 0 15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px}
.categories button{white-space:nowrap;border-radius:30px}
.categories button.active{background:white;color:#101116}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.card{min-width:0;background:var(--panel);border:1px solid #ffffff0c;border-radius:15px;padding:13px;text-align:center;cursor:pointer;transition:transform .18s,border-color .18s}
.card:hover,.card:focus{transform:translateY(-3px);border-color:#2997ff}
.logo{height:92px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#0c0e14;border-radius:10px;overflow:hidden}
.logo img{max-width:90%;max-height:78px;object-fit:contain}
.logo b{font-size:20px;color:#aeb9ce}
.channel-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.channel-cat{font-size:11px;color:var(--muted);margin-top:6px}
.player-wrap{display:none;margin:20px 0;background:#11131a;padding:12px;border-radius:16px}
.player-wrap.show{display:block}
#player{width:100%;max-height:65vh;aspect-ratio:16/9;background:black;border-radius:10px}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.player-head h2{font-size:17px;margin:0}
.player-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{color:var(--muted);font-size:13px;margin:12px 0}
footer{text-align:center;color:#747b8b;font-size:12px;padding:25px}
@media(max-width:520px){header{padding:0 4%;height:60px}.brand{font-size:20px}.search{width:48%;padding:10px;font-size:13px}main{padding:16px 4% 40px}.hero{padding:24px;min-height:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.logo{height:82px}}
</style>
</head>
<body>
<header>
  <div class="brand">CS <span>TV</span></div>
  <input id="search" class="search" type="search" placeholder="Search channels..." aria-label="Search channels">
</header>

<main>
  <section class="hero">
    <div class="eyebrow">YOUR ENTERTAINMENT</div>
    <h1>Television.<br>Reimagined.</h1>
    <p>Your favourite channels, all in one place.</p>
    <div><button class="primary" onclick="showChannels()">▶ Explore Channels</button></div>
  </section>

  <section id="playerWrap" class="player-wrap">
    <div class="player-head">
      <h2 id="nowPlaying">Now Playing</h2>
      <button onclick="closePlayer()">✕ Close</button>
    </div>
    <video id="player" controls autoplay playsinline></video>
    <div class="player-controls">
      <button onclick="previousChannel()">⏮ Previous</button>
      <button onclick="nextChannel()">Next ⏭</button>
      <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
    <p id="status" class="status">Ready to play</p>
  </section>

  <h2 class="section-title" id="channels">Browse Channels</h2>
  <nav class="categories" id="categories" aria-label="Channel categories">
    <button class="active" data-cat="All">All</button>
    <button data-cat="Bangla">Bangla</button>
    <button data-cat="Sports">Sports</button>
    <button data-cat="News">News</button>
    <button data-cat="International">International</button>
    <button data-cat="Entertainment">Entertainment</button>
  </nav>

  <div id="grid" class="grid">
    <p class="status">Loading channels...</p>
  </div>
</main>

<footer>CS TV · Live Television</footer>

<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const player = document.getElementById('player');
const playerWrap = document.getElementById('playerWrap');
const statusText = document.getElementById('status');

let channels = [];
let visibleChannels = [];
let currentIndex = -1;
let hls = null;
let activeCategory = 'All';

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function categoryOf(channel) {
  const cat = String(channel.category || 'Bangla').toLowerCase();
  if (cat.includes('sport')) return 'Sports';
  if (cat.includes('news')) return 'News';
  if (cat.includes('international')) return 'International';
  if (cat.includes('entertain')) return 'Entertainment';
  return channel.category || 'Bangla';
}

async function loadChannels() {
  try {
    const response = await fetch('./channels.json?v=' + Date.now());
    if (!response.ok) throw new Error('channels.json not found');
    const data = await response.json();
    channels = Array.isArray(data) ? data : data.channels;
    if (!Array.isArray(channels)) throw new Error('Invalid channel list');
    channels = channels.filter(c => c && c.name && c.url);
    renderChannels();
  } catch (error) {
    grid.innerHTML = '<p class="status">Could not load channels.json. Check that the file exists in the same folder as index.html.</p>';
  }
}

function renderChannels() {
  const query = search.value.trim().toLowerCase();
  visibleChannels = channels.filter(c => {
    const category = categoryOf(c);
    const categoryMatch = activeCategory === 'All' ||
      category.toLowerCase() === activeCategory.toLowerCase();
    const searchMatch = String(c.name).toLowerCase().includes(query);
    return categoryMatch && searchMatch;
  });

  if (!visibleChannels.length) {
    grid.innerHTML = '<p class="status">No channels found.</p>';
    return;
  }

  grid.innerHTML = visibleChannels.map((c, i) => `
    <div class="card" tabindex="0" role="button"
      aria-label="Play ${esc(c.name)}" data-index="${i}">
      <div class="logo">
        ${c.logo ? `<img src="${esc(c.logo)}" alt="${esc(c.name)} logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` : ''}
        <b style="${c.logo ? 'display:none' : ''}">${esc(String(c.name).slice(0,3).toUpperCase())}</b>
      </div>
      <div class="channel-name">${esc(c.name)}</div>
      <div class="channel-cat">${esc(categoryOf(c))}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach(card => {
    const play = () => playChannel(Number(card.dataset.index));
    card.addEventListener('click', play);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        play();
      }
    });
  });
}

function playChannel(index) {
  const c = visibleChannels[index];
  if (!c) return;
  currentIndex = index;
  playerWrap.classList.add('show');
  document.getElementById('nowPlaying').textContent = c.name;
  statusText.textContent = 'Connecting to stream...';

  if (hls) {
    hls.destroy();
    hls = null;
  }
  player.pause();
  player.removeAttribute('src');
  player.load();

  const url = c.url;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      player.play().catch(() => {
        statusText.textContent = 'Press Play to start the channel.';
      });
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) statusText.textContent =
        'Stream unavailable or unsupported. Try another channel.';
    });
  } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = url;
    player.play().catch(() => {
      statusText.textContent = 'Press Play to start the channel.';
    });
  } else {
    statusText.textContent = 'This device cannot play this stream format.';
  }

  playerWrap.scrollIntoView({behavior:'smooth',block:'start'});
}

function nextChannel() {
  if (visibleChannels.length) playChannel((currentIndex + 1) % visibleChannels.length);
}
function previousChannel() {
  if (visibleChannels.length) playChannel((currentIndex - 1 + visibleChannels.length) % visibleChannels.length);
}
function closePlayer() {
  player.pause();
  if (hls) { hls.destroy(); hls = null; }
  playerWrap.classList.remove('show');
}
function toggleFullscreen() {
  if (player.requestFullscreen) player.requestFullscreen();
  else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
}
function showChannels() {
  document.getElementById('channels').scrollIntoView({behavior:'smooth'});
}

search.addEventListener('input', renderChannels);

document.getElementById('categories').addEventListener('click', e => {
  const button = e.target.closest('button[data-cat]');
  if (!button) return;
  activeCategory = button.dataset.cat;
  document.querySelectorAll('#categories button').forEach(b =>
    b.classList.toggle('active', b === button));
  renderChannels();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
  if (e.key === 'ArrowRight' && document.activeElement === document.body) nextChannel();
  if (e.key === 'ArrowLeft' && document.activeElement === document.body) previousChannel();
});

loadChannels();
</script>
</body>
</html>
