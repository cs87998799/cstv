<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLiv M3U Stream Player</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for playing m3u8 streams in web browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-gray-800 rounded-lg shadow-xl p-6">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-400">SonyLiv Live Stream Player</h1>
        
        <!-- Channel Selector -->
        <div class="mb-4">
            <label for="channelSelect" class="block text-sm font-medium text-gray-300 mb-2">চ্যানেল সিলেক্ট করুন:</label>
            <select id="channelSelect" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-indigo-500">
                <option value="">প্লেলিস্ট লোড হচ্ছে...</option>
            </select>
        </div>

        <!-- Video Player -->
        <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden shadow-inner">
            <video id="videoPlayer" controls autoplay playsinline class="w-full h-full"></video>
        </div>
        
        <p id="status" class="text-xs text-gray-400 mt-3 text-center"></p>
    </div>

    <script>
        // সরাসরি GitHub লিংক এবং ব্যাকআপ প্রক্সি লিংক
        const primaryUrl = "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(primaryUrl);

        const channelSelect = document.getElementById('channelSelect');
        const video = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');
        
        let channels = [];
        let hls;

        // প্লেলিস্ট লোড করার ফাংশন (প্রাইমারি ফেল করলে প্রক্সি দিয়ে ট্রাই করবে)
        async function loadPlaylist() {
            statusText.innerText = "প্লেলিস্ট ডাউনলোড করা হচ্ছে...";
            try {
                let response = await fetch(primaryUrl);
                if (!response.ok) throw new Error("Primary failed");
                let data = await response.text();
                parseM3U(data);
            } catch (err1) {
                console.log("Primary failed, trying proxy...", err1);
                try {
                    let response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Proxy failed");
                    let data = await response.text();
                    parseM3U(data);
                } catch (err2) {
                    console.error("Both failed:", err2);
                    statusText.innerText = "প্লেলিস্ট লোড করতে ব্যর্থ হয়েছে! আপনার ইন্টারনেট বা গিটহাব লিংক চেক করুন।";
                }
            }
        }

        // M3U ফাইল পার্স করা
        function parseM3U(data) {
            const lines = data.split('\n');
            channels = [];
            let currentTitle = '';

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentTitle = parts.length > 1 ? parts[1] : 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    channels.push({ title: currentTitle, url: line });
                    currentTitle = '';
                }
            }

            populateDropdown();
        }

        // ড্রপডাউনে অপশন যোগ করা
        function populateDropdown() {
            channelSelect.innerHTML = '<option value="">-- একটি চ্যানেল বেছে নিন --</option>';
            if (channels.length === 0) {
                statusText.innerText = "কোনো চ্যানেল পাওয়া যায়নি।";
                return;
            }

            channels.forEach((ch, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = ch.title;
                channelSelect.appendChild(option);
            });

            statusText.innerText = `মোট ${channels.length} টি চ্যানেল পাওয়া গেছে।`;
        }

        // চ্যানেল সিলেক্ট করলে ভিডিও প্লে হওয়া
        channelSelect.addEventListener('change', (e) => {
            const index = e.target.value;
            if (index === "") return;

            const selectedChannel = channels[index];
            playStream(selectedChannel.url);
        });

        function playStream(url) {
            statusText.innerText = `প্লে হচ্ছে...`;
            
            // HTTP লিংক হলে HTTPS এ রূপান্তর করা
            if (url.startsWith('http://')) {
                url = url.replace('http://', 'https://');
            }

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => {
                        console.log("Autoplay blocked:", e);
                        statusText.innerText = "অটো-প্লে ব্লক করা হয়েছে, দয়া করে প্লে বাটনে ক্লিক করুন।";
                    });
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                statusText.innerText = "নেটওয়ার্ক ত্রুটি: স্ট্রিম লিংকটি হয়তো এক্সপায়ার হয়ে গেছে।";
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                statusText.innerText = "মিডিয়া ত্রুটি: রিকভার করা হচ্ছে...";
                                hls.recoverMediaError();
                                break;
                            default:
                                statusText.innerText = "এই স্ট্রিমটি বর্তমানে এই ব্রাউজারে চালানো যাচ্ছে না।";
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            } else {
                statusText.innerText = "আপনার ব্রাউজার এই ফরম্যাট সাপোর্ট করে না।";
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
