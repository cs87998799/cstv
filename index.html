
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>CSTV — Live Entertainment</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#090b14;--panel:#141827;--muted:#9ca6bc;--accent:#a78bfa;--cyan:#42e8e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,"Noto Sans Bengali",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
header{height:70px;display:flex;align-items:center;gap:25px;padding:0 5%;background:#0b0e19ee;position:sticky;top:0;z-index:10;border-bottom:1px solid #ffffff10}
.logo{font-size:27px;font-weight:900;letter-spacing:1px;background:linear-gradient(100deg,#a78bfa,#42e8e0);color:transparent;background-clip:text}
nav{display:flex;gap:20px}
nav button,.plain{border:0;background:none;color:#b9c1d2;padding:10px}
nav button:hover,nav button:focus,.plain:focus{color:white;background:#ffffff12;border-radius:9px;outline:2px solid var(--accent)}
.search{margin-left:auto;width:min(240px,36vw);background:#191e2e;border:1px solid #30374b;color:white;padding:11px 14px;border-radius:22px;outline:none}
main{max-width:1500px;margin:auto;padding:22px 4% 50px}
.hero{min-height:290px;border-radius:25px;padding:35px;display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 30%,#573a9b 0,transparent 45%),linear-gradient(115deg,#171c38,#172b49 60%,#123e4a)}
.hero:after{content:"";position:absolute;width:230px;height:230px;right:8%;top:30px;border-radius:50%;background:linear-gradient(135deg,#b3a1ff55,#37e4dc22);filter:blur(2px)}
.hero-content{position:relative;z-index:1;max-width:580px}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:bold;letter-spacing:2px}
h1{font-size:clamp(32px,5vw,55px);margin:15px 0 10px}
.hero p{color:#c1cce0;line-height:1.6}
.primary{background:linear-gradient(100deg,#8b5cf6,#5149df);border:0;border-radius:12px;padding:13px 20px;font-weight:bold}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 15px}
h2{font-size:21px;margin:0}
.muted{color:var(--muted);font-size:13px}
.pills{display:flex;gap:10px;overflow-x:auto;padding:3px 2px 12px}
.pill{white-space:nowrap;border:1px solid #30364b;background:#141827;border-radius:30px;padding:10px 16px}
.pill.active,.pill:focus{background:#493d85;border-color:#9d8aff;outline:2px solid #9d8aff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.channel{background:linear-gradient(145deg,#191e30,#101421);border:1px solid #ffffff0d;border-radius:17px;padding:15px 10px;min-width:0;text-align:center;transition:.18s}
.channel:hover,.channel:focus{transform:translateY(-3px);border-color:#9585ff;outline:2px solid #9585ff}
.logo-box{height:86px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.logo-box img{max-width:100%;max-height:76px;object-fit:contain}
.logo-fallback{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:26px;font-weight:bold;background:linear-gradient(135deg,#7c3aed,#0eaaa9)}
.channel-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{color:#ff6969;font-size:11px;margin-top:7px}
.status{text-align:center;color:var(--muted);padding:30px}
#player-wrap{display:none;margin-top:24px;background:#111522;border:1px solid #2d3448;border-radius:18px;padding:15px}
#player{width:100%;max-height:65vh;background:#000;aspect-ratio:16/9;border-radius:12px}
.player-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#now-title{font-weight:bold;flex:1}
#close{background:#252b3c;border:0;padding:10px 14px;border-radius:9px}
footer{text-align:center;padding:25px;color:#78839a;border-top:1px solid #ffffff0d}
@media(max-width:650px){header{padding:0 4%;gap:12px;height:62px}nav{gap:2px}nav button{padding:8px;font-size:12px}.logo{font-size:22px}.search{width:34vw;padding:9px;font-size:12px}main{padding:16px 4% 35px}.hero{padding:25px 20px;min-height:260px}.hero:after{right:-100px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.channel{padding:10px 5px}.logo-box{height:67px}.logo-box img{max-height:60px}.channel-name{font-size:12px}}
@media(max-width:390px){nav button{font-size:11px;padding:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">CS<span style="color:#fff">TV</span></div>
  <nav>
    <button data-view="home">Home</button>
    <button data-view="all">Live TV</button>
  </nav>
  <input id="search" class="search" placeholder="⌕ Search channels..." aria-label="Search channels">
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <div class="eyebrow">✦ YOUR ENTERTAINMENT HUB</div>
      <h1>Entertainment.<br>Without Limits.</h1>
      <p>Your favourite channels, all in one place.<br>Discover something worth watching.</p>
      <button class="primary" id="explore">▶ &nbsp; Explore Live TV</button>
    </div>
  </section>

  <div class="section-head">
    <h2>Explore Categories</h2>
    <span class="muted" id="count"></span>
  </div>
  <div class="pills" id="categories">
    <button class="pill active" data-cat="All">✦ All Channels</button>
    <button class="pill" data-cat="Sports">⚽ Sports</button>
    <button class="pill" data-cat="Entertainment">★ Entertainment</button>
    <button class="pill" data-cat="News">◉ News</button>
    <button class="pill" data-cat="Movies">🎬 Movies</button>
    <button class="pill" data-cat="Kids">🧸 Kids</button>
    <button class="pill" data-cat="Islamic">☾ Islamic</button>
  </div>

  <section id="player-wrap">
    <div class="player-head">
      <span id="now-title">Now Playing</span>
      <button id="close">✕ Close</button>
    </div>
    <video id="player" controls autoplay playsinline></video>
    <p id="player-msg" class="muted">Loading stream…</p>
  </section>

  <div class="section-head">
    <h2 id="list-title">Popular Live Channels</h2>
    <span class="muted">LIVE ●</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="status" class="status">Loading your channels…</div>
</main>

<footer>© 2026 CSTV · Your world of entertainment</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const grid = $('grid'), status = $('status');
  const video = $('player');
  let channels = [], category = 'All', query = '', hls = null;
  let currentIndex = 0;

  function normalize(item) {
    if (typeof item === 'string') {
      return {name:item,url:item,category:'Other'};
    }
    return {
      name:item.name || item.title || item.channel || 'Unknown Channel',
      url:item.url || item.stream || item.link || item.src || '',
      category:item.category || item.group || item.group_title || 'Other',
      logo:item.logo || item.image || item.icon || ''
    };
  }

  async function loadChannels() {
    status.textContent = 'Loading channels…';
    try {
      const response = await fetch('./channels.json?ts=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw Error('HTTP ' + response.status);
      const data = await response.json();
      let list = Array.isArray(data) ? data :
        Array.isArray(data.channels) ? data.channels :
        Array.isArray(data.data) ? data.data : null;
      if (!list) throw Error('JSON must contain a channels array');
      channels = list.map(normalize).filter(c =>
        c.name && /^https?:\/\//i.test(c.url)
      );
      render();
      if (!channels.length) status.textContent = 'No valid channels found in channels.json.';
    } catch (e) {
      status.textContent = 'Could not load channels.json. Check the file name, JSON format and GitHub Pages URL.';
      console.error(e);
    }
  }

  function render() {
    const filtered = channels.filter(c =>
      (category === 'All' || c.category.toLowerCase().includes(category.toLowerCase())) &&
      c.name.toLowerCase().includes(query.toLowerCase())
    );
    $('count').textContent = filtered.length + ' channels';
    $('list-title').textContent = query ? 'Search Results' :
      category === 'All' ? 'Popular Live Channels' : category + ' Channels';
    grid.replaceChildren();
    status.style.display = filtered.length ? 'none' : 'block';
    if (!filtered.length) status.textContent = 'No channels found in this category.';
    filtered.forEach(c => {
      const card = document.createElement('button');
      card.className = 'channel';
      card.type = 'button';
      const box = document.createElement('div');
      box.className = 'logo-box';
      if (c.logo && /^https?:\/\//i.test(c.logo)) {
        const img = document.createElement('img');
        img.src = c.logo;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => {
          box.replaceChildren();
          const fallback = document.createElement('div');
          fallback.className = 'logo-fallback';
          fallback.textContent = c.name.slice(0,2).toUpperCase();
          box.append(fallback);
        };
        box.append(img);
      } else {
        const fallback = document.createElement('div');
        fallback.className = 'logo-fallback';
        fallback.textContent = c.name.slice(0,2).toUpperCase();
        box.append(fallback);
      }
      const name = document.createElement('div');
      name.className = 'channel-name';
      name.textContent = c.name;
      const live = document.createElement('div');
      live.className = 'live-dot';
      live.textContent = '● LIVE';
      card.append(box,name,live);
      card.addEventListener('click', () => play(c));
      grid.append(card);
    });
  }

  function play(c) {
    $('player-wrap').style.display = 'block';
    $('now-title').textContent = c.name;
    $('player-msg').textContent = 'Connecting to stream…';
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    if (/youtube\.com|youtu\.be/i.test(c.url)) {
      $('player-msg').textContent = 'This is a YouTube link. Direct playback may require an embedded YouTube player.';
      return;
    }

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = c.url;
      video.play().catch(() => $('player-msg').textContent =
        'Press Play to start, or check whether this stream is accessible.');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(c.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => $('player-msg').textContent = 'Press Play to start.');
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) $('player-msg').textContent =
          'Stream unavailable, blocked, or unsupported. Try another channel.';
      });
    } else {
      video.src = c.url;
      $('player-msg').textContent = 'This browser may not support this stream format.';
    }

    $('player-wrap').scrollIntoView({behavior:'smooth',block:'start'});
  }

  function closePlayer() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    if (hls) { hls.destroy(); hls = null; }
    $('player-wrap').style.display = 'none';
  }

  $('search').addEventListener('input', e => {
    query = e.target.value.trim();
    render();
  });
  $('categories').addEventListener('click', e => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    category = btn.dataset.cat;
    document.querySelectorAll('.pill').forEach(b =>
      b.classList.toggle('active', b === btn));
    render();
  });
  $('explore').onclick = () => {
    $('categories').scrollIntoView({behavior:'smooth'});
    $('search').focus({preventScroll:true});
  };
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => {
      category = 'All'; query = '';
      $('search').value = '';
      document.querySelectorAll('.pill').forEach(b =>
        b.classList.toggle('active', b.dataset.cat === 'All'));
      render();
      if (btn.dataset.view === 'home') window.scrollTo({top:0,behavior:'smooth'});
      else $('grid').scrollIntoView({behavior:'smooth'});
    };
  });
  $('close').onclick = closePlayer;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'Backspace' && document.activeElement !== $('search')) {
      if ($('player-wrap').style.display === 'block') closePlayer();
    }
  });

  loadChannels();
})();
</script>
</body>
</html>
