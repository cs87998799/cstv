<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLiv Web Player</title>
    <!-- HLS.js for streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 300px; overflow-y: auto; background: #1e1e1e; border-right: 1px solid #333; padding: 10px; }
        .channel-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .channel-item:hover { background: #2a2a2a; }
        .channel-item img { width: 40px; height: 40px; object-fit: contain; }
        #player-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 80%; max-height: 80vh; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Channels</h3>
        <div id="channel-list">Loading...</div>
    </div>

    <div id="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/srhady/SonyLiv/refs/heads/main/sonyliv_playlist.json';
        const video = document.getElementById('video');
        const channelList = document.getElementById('channel-list');

        // JSON ফেচ করা এবং চ্যানেল লিস্ট তৈরি করা
        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                channelList.innerHTML = '';
                // লক্ষ্য করুন: আপনার JSON ফাইলের স্ট্রাকচার অনুযায়ী ডাটা অ্যারে ফিল্ডের নাম পরিবর্তন হতে পারে (যেমন: data.channels বা সরাসরি data)
                const channels = Array.isArray(data) ? data : (data.channels || data.playlist || []);

                channels.forEach(channel => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerHTML = `
                        <img src="${channel.logo || channel.tvg_logo || ''}" onerror="this.style.display='none'">
                        <span>${channel.name || channel.title}</span>
                    `;
                    
                    div.addEventListener('click', () => {
                        playStream(channel.url || channel.link);
                    });

                    channelList.appendChild(div);
                });
            })
            .catch(error => {
                channelList.innerHTML = 'Failed to load channels.';
                console.error('Error fetching JSON:', error);
            });

        function playStream(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
