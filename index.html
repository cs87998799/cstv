<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10131b;color:white;
  font-family:Arial,sans-serif
}
header{padding:15px 20px;background:#191e2a}
h2{margin:0;color:#48d9ff}
#now{padding:12px 20px;color:#ddd}
.player{width:100%;background:#000}
video{width:100%;height:auto;max-height:65vh;display:block}
.controls{
  display:flex;gap:10px;align-items:center;
  flex-wrap:wrap;padding:12px 16px
}
button,select{
  background:#252d3c;color:white;border:1px solid #526077;
  border-radius:7px;padding:10px 14px;font-size:15px
}
button:focus,select:focus,.channel:focus{
  outline:3px solid #48d9ff
}
button:active{background:#087e9d}
h3{margin:12px 16px}
#channels{
  display:flex;gap:12px;overflow-x:auto;
  padding:12px 16px 22px;scroll-behavior:smooth
}
.channel{
  flex:0 0 125px;background:#1b2230;border:2px solid transparent;
  border-radius:10px;padding:12px 8px;text-align:center;
  cursor:pointer;min-height:120px
}
.channel.active{border-color:#48d9ff;background:#26374a}
.channel img{
  width:65px;height:55px;object-fit:contain;
  display:block;margin:0 auto 8px
}
.channel span{font-size:14px;overflow-wrap:anywhere}
#status{padding:0 16px;color:#ffcf76;font-size:14px}
</style>
</head>

<body>
<header><h2>📺 My Live TV</h2></header>

<div id="now">চ্যানেল লোড হচ্ছে...</div>

<div class="player">
  <video id="video" controls autoplay playsinline></video>
</div>

<div class="controls">
  <button id="prev">⏮ Previous</button>
  <button id="play">▶ Play</button>
  <button id="next">Next ⏭</button>
  <label for="quality">Quality:</label>
  <select id="quality">
    <option value="-1">Auto</option>
  </select>
  <button id="full">⛶ Fullscreen</button>
</div>

<div id="status">প্রস্তুত হচ্ছে...</div>
<h3>All Channels →</h3>
<div id="channels"></div>

<script>
const CHANNELS_URL = "./channels.json";

const video = document.getElementById("video");
const list = document.getElementById("channels");
const now = document.getElementById("now");
const status = document.getElementById("status");
const quality = document.getElementById("quality");

let channels = [];
let current = 0;
let hls = null;
let loading = false;

async function init() {
  try {
    const response = await fetch(CHANNELS_URL + "?t=" + Date.now());
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    if (!Array.isArray(data.channels) || !data.channels.length)
      throw new Error("No channels found");

    channels = data.channels;
    renderChannels();
    playChannel(0);
  } catch (e) {
    now.textContent = "চ্যানেল লোড হয়নি। channels.json ফাইলের URL দেখো।";
    status.textContent = e.message;
  }
}

function renderChannels() {
  list.innerHTML = "";

  channels.forEach((c, i) => {
    const card = document.createElement("div");
    card.className = "channel";
    card.tabIndex = 0;
    card.dataset.index = i;

    const img = document.createElement("img");
    img.src = c.logo || "";
    img.alt = "";
    img.onerror = () => { img.style.visibility = "hidden"; };

    const name = document.createElement("span");
    name.textContent = c.name || "Channel";

    card.append(img, name);
    card.onclick = () => playChannel(i);
    card.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        playChannel(i);
      }
    };
    list.appendChild(card);
  });
}

function updateSelection() {
  document.querySelectorAll(".channel").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });

  const selected = list.children[current];
  if (selected) selected.scrollIntoView({
    behavior: "smooth", block: "nearest", inline: "center"
  });
}

function playChannel(index) {
  if (!channels.length || loading) return;
  current = (index + channels.length) % channels.length;
  const channel = channels[current];

  if (!channel.url) {
    status.textContent = "এই চ্যানেলের URL নেই।";
    return;
  }

  loading = true;
  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  quality.innerHTML = '<option value="-1">Auto</option>';
  now.textContent = "▶ " + channel.name;
  status.textContent = "স্ট্রিম লোড হচ্ছে...";
  updateSelection();

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      const levels = hls.levels;
      const unique = new Map();

      levels.forEach((level, i) => {
        const height = level.height || 0;
        const label = height
          ? height + "p"
          : Math.round((level.bitrate || 0) / 1000) + " kbps";

        if (!unique.has(label)) unique.set(label, i);
      });

      unique.forEach((levelIndex, label) => {
        const option = document.createElement("option");
        option.value = levelIndex;
        option.textContent = label;
        quality.appendChild(option);
      });

      loading = false;
      video.play().catch(() => {
        status.textContent = "Play চাপ দিয়ে চালু করো।";
      });
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        loading = false;
        status.textContent = "স্ট্রিম চালু হয়নি। URL বা নেটওয়ার্ক পরীক্ষা করো।";
      }
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = channel.url;
    loading = false;
    video.play().catch(() => {
      status.textContent = "Play চাপ দিয়ে চালু করো।";
    });
    status.textContent = "Native HLS: manual quality option সীমিত হতে পারে।";
  } else {
    loading = false;
    status.textContent = "এই ব্রাউজারে HLS playback সমর্থিত নয়।";
  }
}

quality.onchange = () => {
  if (hls) {
    hls.currentLevel = Number(quality.value);
  }
};

document.getElementById("prev").onclick = () =>
  playChannel(current - 1);

document.getElementById("next").onclick = () =>
  playChannel(current + 1);

document.getElementById("play").onclick = () => {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
};

video.onplay = () => {
  document.getElementById("play").textContent = "⏸ Pause";
};

video.onpause = () => {
  document.getElementById("play").textContent = "▶ Play";
};

document.getElementById("full").onclick = () => {
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
};

document.addEventListener("keydown", e => {
  if (e.target.matches("select,input")) return;

  if (["MediaTrackNext", "PageDown"].includes(e.key)) {
    e.preventDefault();
    playChannel(current + 1);
  } else if (["MediaTrackPrevious", "PageUp"].includes(e.key)) {
    e.preventDefault();
    playChannel(current - 1);
  } else if (e.key === "ArrowRight" && e.altKey) {
    e.preventDefault();
    playChannel(current + 1);
  } else if (e.key === "ArrowLeft" && e.altKey) {
    e.preventDefault();
    playChannel(current - 1);
  }
});

init();
</script>
</body>
</html>
