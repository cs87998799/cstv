
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSTV - Live TV</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080d18;
  --panel: #131d30;
  --card: #19263b;
  --accent: #22d3ee;
  --text: #f5f7ff;
  --muted: #aab8d0;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 18px;
}

header {
  padding: 22px 24px;
  background: #101a2c;
  border-bottom: 2px solid #243650;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand {
  font-size: 30px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 1px;
}

.live {
  color: #ff657a;
  font-size: 15px;
  font-weight: bold;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

h2 {
  font-size: 25px;
  margin: 8px 0 16px;
}

#search {
  width: 100%;
  padding: 16px;
  margin: 0 0 20px;
  border: 2px solid #30415e;
  border-radius: 12px;
  background: var(--panel);
  color: white;
  font-size: 19px;
}

#search::placeholder {
  color: var(--muted);
}

#channels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.card {
  min-width: 0;
  padding: 18px;
  background: var(--card);
  border: 2px solid #273852;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.channel-head {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
}

.logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  border-radius: 8px;
  background: #fff;
  flex-shrink: 0;
}

.channel-name {
  font-size: 19px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.category {
  color: var(--muted);
  font-size: 15px;
}

button {
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #07111e;
  border: 2px solid transparent;
  border-radius: 10px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:focus,
#search:focus,
a:focus {
  outline: 4px solid #fff;
  outline-offset: 4px;
}

.card:focus-within {
  border-color: var(--accent);
}

button:active {
  background: #9befff;
}

#playerBox {
  display: none;
  margin: 20px 0;
  padding: 16px;
  background: #000;
  border: 2px solid #30415e;
  border-radius: 16px;
}

#playingName {
  display: block;
  margin-bottom: 12px;
  font-size: 20px;
}

video {
  width: 100%;
  max-height: 65vh;
  background: #000;
}

.close-button {
  margin-top: 12px;
  background: #293952;
  color: white;
}

#status {
  color: var(--muted);
  padding: 12px 0;
}

footer {
  padding: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

@media (min-width: 900px) {
  main {
    padding: 28px;
  }

  #channels {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<header>
  <div class="brand">📺 CSTV</div>
  <div class="live">● LIVE TV</div>
</header>

<main>
  <h2>Live Channels</h2>

  <input
    id="search"
    type="search"
    placeholder="🔎 Search channels..."
    aria-label="Search channels"
  >

  <section id="playerBox">
    <b id="playingName">Now Playing</b>
    <video id="player" controls autoplay playsinline></video>
    <button id="closePlayer" class="close-button">✕ Close Player</button>
  </section>

  <div id="status" role="status">Loading channels...</div>
  <section id="channels"></section>
</main>

<footer>CSTV • Your Live TV</footer>

<script>
const playlistURL =
  "https://cs87998799.github.io/cstv/channels.json";

let channels = [];

const search = document.getElementById("search");
const channelList = document.getElementById("channels");
const statusBox = document.getElementById("status");
const playerBox = document.getElementById("playerBox");
const player = document.getElementById("player");

function makeText(tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value || "";
  return element;
}

async function loadChannels() {
  try {
    const response = await fetch(
      playlistURL + "?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Playlist unavailable");
    }

    const data = await response.json();
    channels = Array.isArray(data) ? data : data.channels || [];

    statusBox.textContent = channels.length
      ? channels.length + " channels available"
      : "No channels available";

    renderChannels();
  } catch (error) {
    statusBox.textContent =
      "Could not load channels. Please check your internet connection.";
  }
}

function renderChannels() {
  const query = search.value.trim().toLowerCase();

  const filtered = channels.filter(channel =>
    (channel.name || "").toLowerCase().includes(query) ||
    (channel.category || "").toLowerCase().includes(query)
  );

  channelList.replaceChildren();

  if (!filtered.length) {
    statusBox.textContent = "No matching channels found.";
    return;
  }

  statusBox.textContent = filtered.length + " channels";

  filtered.forEach(channel => {
    const card = document.createElement("article");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "channel-head";

    if (channel.logo) {
      const logo = document.createElement("img");
      logo.className = "logo";
      logo.src = channel.logo;
      logo.alt = "";
      logo.loading = "lazy";
      head.appendChild(logo);
    }

    const name = makeText(
      "div", "channel-name", channel.name || "Channel"
    );

    head.appendChild(name);
    card.appendChild(head);

    card.appendChild(
      makeText("div", "category", channel.category || "Live TV")
    );

    const playButton = document.createElement("button");
    playButton.type = "button";
    playButton.textContent = "▶ Play Channel";
    playButton.setAttribute(
      "aria-label", "Play " + (channel.name || "Channel")
    );

    playButton.addEventListener("click", () => {
      playChannel(channel);
    });

    card.appendChild(playButton);
    channelList.appendChild(card);
  });
}

function playChannel(channel) {
  if (!channel.url) {
    alert("Stream URL unavailable.");
    return;
  }

  playerBox.style.display = "block";
  document.getElementById("playingName").textContent =
    "▶ " + (channel.name || "Channel");

  player.src = channel.url;
  player.load();

  player.play().catch(() => {
    statusBox.textContent =
      "Playback failed. This stream may not be supported by the player.";
  });

  playerBox.scrollIntoView({ behavior: "smooth", block: "start" });
}

function stopPlayer() {
  player.pause();
  player.removeAttribute("src");
  player.load();
  playerBox.style.display = "none";
}

search.addEventListener("input", renderChannels);
document.getElementById("closePlayer")
  .addEventListener("click", stopPlayer);

loadChannels();
</script>
</body>
</html>
