    var decl = deg(Math.asin(Math.sin(rad(eps)) * Math.sin(rad(lam))));
    var y2 = Math.pow(Math.tan(rad(eps / 2)), 2);
    var eot = 4 * deg(y2 * Math.sin(2 * rad(L0)) - 2 * e * Math.sin(rad(M)) + 4 * e * y2 * Math.sin(rad(M)) * Math.cos(2 * rad(L0)) - 0.5 * y2 * y2 * Math.sin(4 * rad(L0)) - 1.25 * e * e * Math.sin(2 * rad(M)));
    var noon = 720 - 4 * LON - eot + TZ * 60;
    var H = function (alt) {
      var c = (Math.sin(rad(alt)) - Math.sin(rad(LAT)) * Math.sin(rad(decl))) / (Math.cos(rad(LAT)) * Math.cos(rad(decl)));
      return deg(Math.acos(Math.max(-1, Math.min(1, c)))) * 4;
    };
    var hs = H(-0.833);
    var asrAlt = deg(Math.atan(1 / (ASR_SHADOW + Math.tan(rad(Math.abs(LAT - decl))))));   // হানাফী আসর
    var r = Math.round;
    return {
      sunrise: r(noon - hs), sunset: r(noon + hs),
      fajr: r(noon - H(-18) + FAJR_ADD), sehri: r(noon - H(-18) + FAJR_ADD) - SEHRI_BEFORE_FAJR,
      zuhr: r(noon + ZUHR_OFFSET), asr: r(noon + H(asrAlt)),
      maghrib: r(noon + hs + MAGHRIB_ADD), isha: r(noon + H(-18) + ISHA_ADD)
    };
  }

  function period(h) {
    if (h < 4) return 'রাত'; if (h < 6) return 'ভোর'; if (h < 12) return 'সকাল';
    if (h < 16) return 'দুপুর'; if (h < 18) return 'বিকেল'; if (h < 20) return 'সন্ধ্যা'; return 'রাত';
  }
  function fmt(min) {
    min = ((min % 1440) + 1440) % 1440;
    var h = Math.floor(min / 60), mi = min % 60, h12 = h % 12 === 0 ? 12 : h % 12;
    return period(h) + ' ' + bn(pad2(h12) + ':' + pad2(mi)) + ' মি.';
  }
  function dur(mins) { return bn(Math.floor(mins / 60)) + ' ঘণ্টা ' + bn(mins % 60) + ' মিনিট'; }

  function greeting(min) {
    var h = Math.floor(min / 60);
    if (h >= 4 && h < 12) return { ic: '🌸', t: 'শুভ সকাল', w: 'দিনটি' };
    if (h >= 12 && h < 16) return { ic: '☀️', t: 'শুভ দুপুর', w: 'দিনটি' };
    if (h >= 16 && h < 18) return { ic: '🌇', t: 'শুভ বিকেল', w: 'বিকেলটি' };
    if (h >= 18 && h < 20) return { ic: '🌆', t: 'শুভ সন্ধ্যা', w: 'সন্ধ্যাটি' };
    return { ic: '🌙', t: 'শুভ রাত্রি', w: 'রাতটি' };
  }

  function holidayText(t) {
    var key = t.y + '-' + pad2(t.m) + '-' + pad2(t.d);
    var name = EXTRA_HOLIDAYS[key] || FIXED_HOLIDAYS[pad2(t.m) + '-' + pad2(t.d)];
    var weekly = (t.wd === 5 || t.wd === 6);                       // শুক্র-শনি সাপ্তাহিক ছুটি
    if (name && weekly) return 'আজ সরকারি ছুটি — ' + name + ' (সাপ্তাহিক ছুটির দিনও)।';
    if (name) return 'আজ সরকারি ছুটি — ' + name + '।';
    if (weekly) return 'আজ সাপ্তাহিক ছুটির দিন (' + WEEK[t.wd] + ')।';
    return 'আজ কোনো সরকারি সাধারণ ছুটি নেই।';
  }

  /* ---------- সব তথ্য একসাথে ---------- */
  
function esc(x){return String(x)}
function render(){
  var now=new Date(Date.now()+6*3600e3), y=now.getUTCFullYear(), m=now.getUTCMonth()+1, d=now.getUTCDate();
  var st=sunTimes(y,m,d), nowMin=now.getUTCHours()*60+now.getUTCMinutes()+now.getUTCSeconds()/60;
  var L=[['সেহরি শেষ','sehri'],['ফজর','fajr'],['যোহর','zuhr'],['আসর','asr'],['মাগরিব','maghrib'],['এশা','isha']];
  var nx=null; L.forEach(function(p){ if(!nx && p[1]!=='sehri' && st[p[1]]>nowMin) nx=p; });
  var tom=null; if(!nx){ var t2=new Date(now.getTime()+864e5); tom=sunTimes(t2.getUTCFullYear(),t2.getUTCMonth()+1,t2.getUTCDate()); nx=['ফজর','fajr']; }
  var tmin = tom ? tom.fajr+1440 : st[nx[1]], left=Math.max(0,Math.round(tmin-nowMin)), h=Math.floor(left/60);
  document.getElementById('nx').innerHTML = nx[0]+' — '+fmt(tom?tom.fajr:st[nx[1]]).replace(' মি.','')+'<small>আর '+(h?bn(h)+' ঘণ্টা ':'')+bn(left%60)+' মিনিট বাকি</small>';
  document.getElementById('g').innerHTML = L.map(function(p){ return '<div'+(nx[1]===p[1]&&!tom?' class="on"':'')+'><span>'+p[0]+'</span><b>'+fmt(st[p[1]]).replace(' মি.','')+'</b></div>'; }).join('');
  try{ var hj=hijriDate(y,m,d); document.getElementById('hj').textContent = bn(hj.day)+' '+HJ_MONTHS[hj.month]+' '+bn(hj.year)+' হিজরি • '+bn(d)+' '+GR_MONTHS[m-1]+' '+bn(y); }catch(e){}
}
render(); setInterval(render,20000);
document.getElementById('rt').onclick=function(){ location.href='./'; };
window.addEventListener('online',function(){ location.href='./'; });
})();
</script></body></html>
